  to   { transform: translateY(0) scale(1); opacity: 1; }
}

@keyframes toast-out {
  to { transform: translateY(-20px) scale(0.94); opacity: 0; }
}

/* ----------------------------------------------------------------------------
 * 38. FORMS & INPUTS
   ---------------------------------------------------------------------------- */
.field {
  margin-bottom: 14px;
}

.field:last-child {
  margin-bottom: 0;
}

.field-label {
  display: block;
  font-size: 11.5px;
  font-weight: 900;
  color: var(--text-muted);
  margin-bottom: 7px;
  text-transform: uppercase;
  letter-spacing: 0.06em;
}

.input,
.select,
.textarea {
  width: 100%;
  padding: 12px 14px;
  border-radius: var(--r-md);
  border: 1.5px solid var(--border-strong);
  background: var(--card-2);
  font-size: 14.5px;
  font-weight: 700;
  color: var(--text);
  transition: border-color var(--t-normal), box-shadow var(--t-normal);
}

.input:focus,
.select:focus,
.textarea:focus {
  outline: none;
  border-color: var(--primary);
  box-shadow: 0 0 0 4px var(--primary-soft);
}

.input::placeholder,
.textarea::placeholder {
  color: var(--text-muted);
  opacity: 0.7;
}

.select {
  cursor: pointer;
  background-image: url("data:image/svg+xml;charset=UTF-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%239a8cb0' stroke-width='3' stroke-linecap='round'%3E%3Cpath d='M6 9l6 6 6-6'/%3E%3C/svg%3E");
  background-repeat: no-repeat;
  background-position: right 12px center;
  background-size: 16px;
  padding-right: 40px;
}

.textarea {
  resize: vertical;
  min-height: 80px;
  font-family: inherit;
}

.switch-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 13px 0;
  border-bottom: 1px solid var(--border);
}

.switch-row:last-child {
  border-bottom: none;
}

.switch-row .info {
  flex: 1;
  min-width: 0;
}

.switch-row .info .label {
  font-weight: 800;
  font-size: 14.5px;
}

.switch-row .info .sub {
  font-size: 12px;
  color: var(--text-muted);
  margin-top: 3px;
  font-weight: 700;
}

.switch {
  width: 52px;
  height: 30px;
  border-radius: var(--r-pill);
  background: var(--border-strong);
  position: relative;
  transition: background var(--t-normal);
  flex-shrink: 0;
  cursor: pointer;
  border: none;
  -webkit-tap-highlight-color: transparent;
}

.switch::after {
  content: '';
  position: absolute;
  top: 3px;
  left: 3px;
  width: 24px;
  height: 24px;
  border-radius: 50%;
  background: #ffffff;
  box-shadow: 0 2px 6px rgba(0, 0, 0, 0.22);
  transition: transform 320ms var(--spring);
}

.switch.on {
  background: var(--success);
}

.switch.on::after {
  transform: translateX(22px);
}

/* ----------------------------------------------------------------------------
 * 39. AVATARS
   ---------------------------------------------------------------------------- */
.avatar-grid {
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  gap: 8px;
}

.avatar-option {
  aspect-ratio: 1 / 1;
  border-radius: 14px;
  background: var(--card-2);
  border: 2px solid var(--border);
  display: grid;
  place-items: center;
  font-size: 24px;
  transition: transform var(--t-fast) var(--ease),
              border-color var(--t-normal),
              background var(--t-normal);
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  line-height: 1;
}

.avatar-option:hover {
  background: var(--card-hover);
}

.avatar-option:active {
  transform: scale(0.9);
}

.avatar-option.selected {
  border-color: var(--primary);
  background: var(--primary-soft);
  transform: scale(1.05);
  box-shadow: 0 0 0 3px var(--primary-soft);
}

/* ----------------------------------------------------------------------------
 * 40. RARITY EFFECTS
   ---------------------------------------------------------------------------- */
.rarity-common    { --rarity-color: #9a8cb0; }
.rarity-uncommon  { --rarity-color: #22a34a; }
.rarity-rare      { --rarity-color: #2a86d4; }
.rarity-epic      { --rarity-color: #8f5cff; }
.rarity-legendary { --rarity-color: #d99e00; }
.rarity-mythic    { --rarity-color: #d938a0; }

.glow-common    { box-shadow: 0 0 8px rgba(154, 140, 176, 0.4); }
.glow-uncommon  { box-shadow: 0 0 12px rgba(34, 163, 74, 0.45); }
.glow-rare      { box-shadow: 0 0 14px rgba(42, 134, 212, 0.5); }
.glow-epic      { box-shadow: 0 0 18px rgba(143, 92, 255, 0.55); }
.glow-legendary { box-shadow: 0 0 24px rgba(217, 158, 0, 0.6); }
.glow-mythic    { box-shadow: 0 0 30px rgba(217, 56, 160, 0.65); }

.rainbow-text {
  background: linear-gradient(90deg, #ff7eb3, #ffc93c, #4ade80, #5eb8ff, #b48eff, #ff7eb3);
  background-size: 400% 100%;
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  animation: rainbow 4s linear infinite;
}

@keyframes rainbow {
  0%   { background-position: 0% 50%; }
  100% { background-position: 400% 50%; }
}

/* ----------------------------------------------------------------------------
 * 41. ANIMATIONS
   ---------------------------------------------------------------------------- */
@keyframes fade-in {
  from { opacity: 0; transform: translateY(8px); }
  to   { opacity: 1; transform: translateY(0); }
}

@keyframes fade-out {
  from { opacity: 1; }
  to   { opacity: 0; }
}

@keyframes slide-up {
  from { transform: translateY(20px); opacity: 0; }
  to   { transform: translateY(0); opacity: 1; }
}

@keyframes slide-down {
  from { transform: translateY(-20px); opacity: 0; }
  to   { transform: translateY(0); opacity: 1; }
}

@keyframes scale-in {
  from { transform: scale(0.8); opacity: 0; }
  to   { transform: scale(1); opacity: 1; }
}

@keyframes rotate-360 {
  from { transform: rotate(0); }
  to   { transform: rotate(360deg); }
}

@keyframes spin {
  0% { transform: rotate(0); }
  100% { transform: rotate(360deg); }
}

@keyframes shake {
  0%, 100% { transform: translateX(0); }
  20% { transform: translateX(-4px); }
  40% { transform: translateX(4px); }
  60% { transform: translateX(-3px); }
  80% { transform: translateX(3px); }
}

@keyframes bounce {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-6px); }
}

.fade-in { animation: fade-in 400ms var(--ease); }
.slide-up { animation: slide-up 400ms var(--ease); }
.slide-down { animation: slide-down 400ms var(--ease); }
.scale-in { animation: scale-in 400ms var(--spring); }
.spin { animation: spin 1s linear infinite; }
.shake { animation: shake 400ms ease; }
.bounce { animation: bounce 1s ease-in-out infinite; }

.stagger > * {
  animation: fade-in 450ms var(--ease) backwards;
}

.stagger > *:nth-child(1)  { animation-delay: 0.02s; }
.stagger > *:nth-child(2)  { animation-delay: 0.05s; }
.stagger > *:nth-child(3)  { animation-delay: 0.08s; }
.stagger > *:nth-child(4)  { animation-delay: 0.11s; }
.stagger > *:nth-child(5)  { animation-delay: 0.14s; }
.stagger > *:nth-child(6)  { animation-delay: 0.17s; }
.stagger > *:nth-child(7)  { animation-delay: 0.20s; }
.stagger > *:nth-child(8)  { animation-delay: 0.23s; }
.stagger > *:nth-child(9)  { animation-delay: 0.26s; }
.stagger > *:nth-child(10) { animation-delay: 0.29s; }
.stagger > *:nth-child(11) { animation-delay: 0.32s; }
.stagger > *:nth-child(12) { animation-delay: 0.35s; }
.stagger > *:nth-child(13) { animation-delay: 0.38s; }
.stagger > *:nth-child(14) { animation-delay: 0.41s; }
.stagger > *:nth-child(15) { animation-delay: 0.44s; }
.stagger > *:nth-child(16) { animation-delay: 0.47s; }
.stagger > *:nth-child(17) { animation-delay: 0.5s; }
.stagger > *:nth-child(18) { animation-delay: 0.53s; }
.stagger > *:nth-child(19) { animation-delay: 0.56s; }
.stagger > *:nth-child(20) { animation-delay: 0.59s; }

/* ----------------------------------------------------------------------------
 * 42. CONFETTI
   ---------------------------------------------------------------------------- */
#confetti-canvas {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  z-index: var(--z-confetti);
}

/* ----------------------------------------------------------------------------
 * 43. PARTICLES
   ---------------------------------------------------------------------------- */
.particle {
  position: fixed;
  pointer-events: none;
  font-size: 20px;
  z-index: var(--z-confetti);
  animation: particle-float 1.2s var(--ease) forwards;
}

@keyframes particle-float {
  0%   { transform: translate(0, 0) scale(0.5); opacity: 1; }
  50%  { transform: translate(var(--dx, 0), -30px) scale(1.1); opacity: 1; }
  100% { transform: translate(var(--dx, 0), -70px) scale(0.7); opacity: 0; }
}

/* ----------------------------------------------------------------------------
 * 44. UTILITIES
   ---------------------------------------------------------------------------- */
.divider {
  height: 1px;
  background: var(--border);
  margin: 15px 0;
  border: none;
}

.divider.spaced {
  margin: 22px 0;
}

.divider.dashed {
  background: none;
  border-top: 1.5px dashed var(--border-strong);
  height: 0;
}

.empty-state {
  text-align: center;
  padding: 34px 20px;
}

.empty-state .icon {
  font-size: 52px;
  margin-bottom: 12px;
  opacity: 0.85;
  line-height: 1;
}

.empty-state .title {
  font-weight: 900;
  font-size: 15px;
  margin-bottom: 6px;
}

.empty-state .text {
  color: var(--text-muted);
  font-size: 13px;
  font-weight: 700;
  line-height: 1.5;
  max-width: 280px;
  margin: 0 auto;
}

.tabs-header {
  display: flex;
  gap: 4px;
  padding: 5px;
  background: var(--card-2);
  border-radius: var(--r-md);
  border: 1.5px solid var(--border);
  margin-bottom: 14px;
  overflow-x: auto;
  scrollbar-width: none;
}

.tabs-header::-webkit-scrollbar { display: none; }

.tab-btn {
  flex: 1;
  padding: 9px 14px;
  border-radius: var(--r-sm);
  font-size: 13px;
  font-weight: 900;
  color: var(--text-muted);
  transition: background var(--t-normal), color var(--t-normal);
  white-space: nowrap;
  cursor: pointer;
  letter-spacing: -0.005em;
  min-width: fit-content;
}

.tab-btn:hover {
  color: var(--text);
}

.tab-btn.active {
  background: var(--card);
  color: var(--primary);
  box-shadow: var(--shadow-sm);
}

/* NOTIFICATION BANNER */
.notification-banner {
  padding: 14px 16px;
  border-radius: var(--r-md);
  background: linear-gradient(120deg, var(--primary-soft), var(--secondary-soft));
  border: 1.5px solid var(--border-strong);
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 14px;
  cursor: pointer;
  transition: transform var(--t-fast) var(--ease);
}

.notification-banner:active {
  transform: scale(0.985);
}

.notification-banner .nb-icon {
  font-size: 28px;
  line-height: 1;
  flex-shrink: 0;
}

.notification-banner .nb-body {
  flex: 1;
  min-width: 0;
}

.notification-banner .nb-title {
  font-weight: 900;
  font-size: 14px;
  margin-bottom: 2px;
}

.notification-banner .nb-text {
  font-size: 12px;
  color: var(--text-soft);
  font-weight: 700;
  line-height: 1.4;
}

.notification-banner.urgent {
  background: linear-gradient(120deg, var(--danger-soft), var(--accent-soft));
  border-color: rgba(255, 107, 129, 0.45);
}

/* MODAL SHEET (bottom sheet) */
.sheet-overlay {
  position: fixed;
  inset: 0;
  z-index: var(--z-modal);
  display: flex;
  align-items: flex-end;
  justify-content: center;
  padding: 0;
  background: rgba(20, 10, 40, 0.55);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  opacity: 0;
  pointer-events: none;
  transition: opacity var(--t-normal) ease;
}

.sheet-overlay.show {
  opacity: 1;
  pointer-events: auto;
}

.sheet {
  background: var(--card);
  border-radius: var(--r-2xl) var(--r-2xl) 0 0;
  padding: 22px 20px calc(22px + env(safe-area-inset-bottom, 0px));
  width: 100%;
  max-width: 640px;
  max-height: 88vh;
  overflow-y: auto;
  transform: translateY(100%);
  transition: transform 400ms var(--ease);
  box-shadow: 0 -10px 40px rgba(0, 0, 0, 0.2);
}

.sheet-overlay.show .sheet {
  transform: translateY(0);
}

.sheet-handle {
  width: 44px;
  height: 5px;
  border-radius: 3px;
  background: var(--border-strong);
  margin: 0 auto 16px;
}

/* SCROLLBAR */
::-webkit-scrollbar {
  width: 8px;
  height: 8px;
}

::-webkit-scrollbar-track {
  background: transparent;
}

::-webkit-scrollbar-thumb {
  background: var(--border-strong);
  border-radius: 99px;
}

::-webkit-scrollbar-thumb:hover {
  background: var(--text-muted);
}

* {
  scrollbar-width: thin;
  scrollbar-color: var(--border-strong) transparent;
}

/* ----------------------------------------------------------------------------
 * 45. RESPONSIVE
   ---------------------------------------------------------------------------- */
@media (max-width: 420px) {
  .app {
    padding-left: 10px;
    padding-right: 10px;
  }
  .hero {
    padding: 18px;
  }
  .hero-avatar {
    width: 52px;
    height: 52px;
    font-size: 28px;
  }
  .hero-greeting .hi {
    font-size: 17px;
  }
  .hero-ring,
  .hero-ring svg {
    width: 104px;
    height: 104px;
  }
  .hero-ring-label .num {
    font-size: 28px;
  }
  .hero-stat {
    padding: 8px 10px;
    font-size: 12px;
  }
  .hero-stat .val {
    font-size: 14px;
  }
  .week-grid {
    gap: 5px;
  }
  .day-cell {
    padding: 8px 2px 7px;
  }
  .day-cell .dnum {
    font-size: 14px;
  }
  .avatar-grid {
    grid-template-columns: repeat(4, 1fr);
  }
  .stats-grid {
    gap: 8px;
  }
  .stat-card {
    padding: 12px;
  }
  .stat-card .stat-value {
    font-size: 22px;
  }
  .tab {
    font-size: 8.5px;
    padding: 7px 4px 5px;
    min-width: 54px;
  }
  .tab-icon {
    font-size: 18px;
  }
  .lootbox-grid {
    grid-template-columns: 1fr;
  }
  .year-grid {
    grid-template-columns: repeat(2, 1fr);
  }
  .modal-box {
    padding: 22px 18px 18px;
  }
}

@media (min-width: 720px) {
  .app {
    padding-top: 24px;
  }
  .topbar {
    padding-top: 18px;
  }
  .grid-auto {
    grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
  }
}

@media (min-width: 900px) {
  .app {
    max-width: 720px;
  }
}

/* ----------------------------------------------------------------------------
 * 46. ACCESSIBILITY
   ---------------------------------------------------------------------------- */
@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
    scroll-behavior: auto !important;
  }
}

@media (prefers-contrast: more) {
  :root {
    --border: #666;
    --border-strong: #333;
  }
  .card {
    border-width: 2px;
  }
}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

/* ----------------------------------------------------------------------------
 * 47. PRINT
   ---------------------------------------------------------------------------- */
@media print {
  .tabbar,
  .topbar,
  .icon-btn,
  .btn,
  #confetti-canvas {
    display: none !important;
  }
  .app {
    padding: 0;
    max-width: 100%;
  }
  .card {
    box-shadow: none;
    border: 1px solid #ccc;
    page-break-inside: avoid;
  }
  body {
    background: #fff;
    color: #000;
  }
}

/* END OF CSS */

const $ = (sel, root) => (root || document).querySelector(sel);
const $$ = (sel, root) => Array.prototype.slice.call((root || document).querySelectorAll(sel));

function pad2(n) { return String(n).padStart(2, '0'); }
function pad3(n) { return String(n).padStart(3, '0'); }

function isoOf(date) {
  return date.getFullYear() + '-' + pad2(date.getMonth() + 1) + '-' + pad2(date.getDate());
}

function dateFromKey(key) {
  const p = key.split('-').map(Number);
  return new Date(p[0], p[1] - 1, p[2]);
}

function todayKey() { return isoOf(new Date()); }

function startOfDay(d) {
  const x = new Date(d.getTime());
  x.setHours(0, 0, 0, 0);
  return x;
}

function addDays(d, n) {
  const x = new Date(d.getTime());
  x.setDate(x.getDate() + n);
  x.setHours(0, 0, 0, 0);
  return x;
}

function addMonths(d, n) {
  const x = new Date(d.getTime());
  x.setMonth(x.getMonth() + n);
  return x;
}

function weekStartOf(d) {
  const x = startOfDay(d);
  const dow = (x.getDay() + 6) % 7;
  x.setDate(x.getDate() - dow);
  return x;
}

function weekKeyOf(d) { return isoOf(weekStartOf(d)); }
function monthKeyOf(d) { return d.getFullYear() + '-' + pad2(d.getMonth() + 1); }
function yearKeyOf(d) { return String(d.getFullYear()); }

function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
function uid() { return Math.random().toString(36).slice(2, 10); }

function escapeHtml(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
  }[c]));
}

function fmtDuration(totalSeconds) {
  const s = Math.max(0, Math.round(totalSeconds));
  const m = Math.floor(s / 60);
  const r = s % 60;
  return m + ':' + pad2(r);
}

function fmtDurationLong(totalSeconds) {
  const s = Math.max(0, Math.round(totalSeconds));
  const m = Math.floor(s / 60);
  const r = s % 60;
  if (m === 0) return r + 's';
  return m + 'm ' + pad2(r) + 's';
}

function fmtTime(iso) {
  const d = new Date(iso);
  return pad2(d.getHours()) + ':' + pad2(d.getMinutes());
}

function fmtRelative(iso) {
  const now = Date.now();
  const then = new Date(iso).getTime();
  const diff = Math.round((now - then) / 1000);
  if (diff < 60) return LANG === 'fr' ? 'à l\'instant' : 'just now';
  if (diff < 3600) return Math.floor(diff / 60) + (LANG === 'fr' ? ' min' : ' min');
  if (diff < 86400) return Math.floor(diff / 3600) + (LANG === 'fr' ? ' h' : 'h');
  return Math.floor(diff / 86400) + (LANG === 'fr' ? ' j' : 'd');
}

function fmtCountdown(ms) {
  const totalSec = Math.max(0, Math.floor(ms / 1000));
  const h = Math.floor(totalSec / 3600);
  const m = Math.floor((totalSec % 3600) / 60);
  const s = totalSec % 60;
  if (h > 0) return h + 'h ' + pad2(m) + 'm';
  if (m > 0) return m + 'm ' + pad2(s) + 's';
  return s + 's';
}

function fmtLongDate(d) {
  return d.toLocaleDateString(LANG === 'fr' ? 'fr-FR' : 'en-US', {
    weekday: 'long', day: 'numeric', month: 'long',
  });
}

function fmtShortDate(d) {
  return d.toLocaleDateString(LANG === 'fr' ? 'fr-FR' : 'en-US', {
    day: 'numeric', month: 'short',
  });
}

function weekdayShort(d) {
  const names = ['sunday', 'monday', 'tuesday', 'wednesday', 'thursday', 'friday', 'saturday'];
  return t(names[d.getDay()]);
}

function clone(obj) { return JSON.parse(JSON.stringify(obj)); }

function weightedRandom(items, weightKey) {
  const key = weightKey || 'weight';
  let total = 0;
  items.forEach(it => { total += (it[key] || 0); });
  let r = Math.random() * total;
  for (const it of items) {
    r -= (it[key] || 0);
    if (r <= 0) return it;
  }
  return items[items.length - 1];
}

function randomInt(a, b) { return Math.floor(Math.random() * (b - a + 1)) + a; }

function pickRarity(boost) {
  const boostFactor = boost ? 1 + boost : 1;
  const list = RARITY_ORDER.map(k => ({
    key: k,
    weight: RARITY[k].weight * (k === 'common' ? 1 : boostFactor),
  }));
  const chosen = weightedRandom(list, 'weight');
  return chosen.key;
}

function getRarityInfo(key) { return RARITY[key] || RARITY.common; }

function migrateState(data) {
  const base = createInitialState();
  const out = Object.assign({}, base, data || {});

  out.loot = Object.assign({}, base.loot, (data && data.loot) || {});
  out.pets = Object.assign({}, base.pets, (data && data.pets) || {});
  out.collection = Object.assign({}, base.collection, (data && data.collection) || {});
  out.spin = Object.assign({}, base.spin, (data && data.spin) || {});
  out.dailyLogin = Object.assign({}, base.dailyLogin, (data && data.dailyLogin) || {});
  out.battlePass = Object.assign({}, base.battlePass, (data && data.battlePass) || {});
  out.skills = Object.assign({}, base.skills, (data && data.skills) || {});
  out.inventory = (data && data.inventory) || {};
  out.crafted = (data && data.crafted) || [];

  if (!Array.isArray(out.tasks) || !out.tasks.length) out.tasks = clone(DEFAULT_TASKS);
  if (!Array.isArray(out.rewards) || !out.rewards.length) out.rewards = clone(DEFAULT_REWARDS);

  // Clean stale timers
  const now = Date.now();
  Object.keys(out.timers).forEach(id => {
    if (now - out.timers[id] > 3 * 60 * 60 * 1000) delete out.timers[id];
  });

  // Ensure pets.activeId is valid
  if (out.pets.activeId && !out.pets.owned[out.pets.activeId]) {
    out.pets.activeId = null;
  }

  return out;
}

function activeTasks() {
  return S.tasks.filter(x => x.active !== false);
}

function getDayData(key, create) {
  if (!S.days[key]) {
    if (!create) return { done: {} };
    S.days[key] = { done: {} };
  }
  return S.days[key];
}

function dayDoneCount(key) {
  const d = S.days[key];
  if (!d) return 0;
  const ids = activeTasks().map(x => x.id);
  return ids.filter(id => d.done[id]).length;
}

function dayEarnedPoints(key) {
  const d = S.days[key];
  if (!d) return 0;
  return Object.keys(d.done).reduce(
    (sum, id) => sum + (d.done[id].points || 0) + (d.done[id].bonus || 0),
    0
  );
}

function isPerfectDay(key) {
  const tasks = activeTasks();
  if (!tasks.length) return false;
  const d = S.days[key];
  if (!d) return false;
  return tasks.every(x => !!d.done[x.id]);
}

function totalEarnedPoints() {
  return Object.keys(S.days).reduce((sum, k) => sum + dayEarnedPoints(k), 0);
}

function availablePoints() {
  return Math.max(0, totalEarnedPoints() - S.spentPoints);
}

function levelInfo(points) {
  let level = 1;
  while (25 * level * level <= points && level < APP.maxLevel) level++;
  const base = 25 * (level - 1) * (level - 1);
  const next = 25 * level * level;
  const span = Math.max(1, next - base);
  const into = points - base;
  return {
    level,
    into,
    span,
    next,
    pct: clamp(into / span, 0, 1),
    totalXP: points,
  };
}

function currentStreak() {
  let n = 0;
  let d = startOfDay(new Date());
  if (!isPerfectDay(isoOf(d))) d = addDays(d, -1);
  let guard = 0;
  while (isPerfectDay(isoOf(d)) && guard < 5000) {
    n++;
    d = addDays(d, -1);
    guard++;
  }
  return n;
}

function bestStreak() {
  const keys = Object.keys(S.days).filter(isPerfectDay).sort();
  let best = 0, run = 0, prev = null;
  keys.forEach(k => {
    const d = dateFromKey(k);
    if (prev && (d - prev) === 86400000) run++;
    else run = 1;
    prev = d;
    if (run > best) best = run;
  });
  return best;
}

function weekPerfectCount(mondayKey) {
  const monday = dateFromKey(mondayKey);
  let n = 0;
  for (let i = 0; i < 7; i++) {
    if (isPerfectDay(isoOf(addDays(monday, i)))) n++;
  }
  return n;
}

function weekTasksCount(mondayKey) {
  const monday = dateFromKey(mondayKey);
  let n = 0;
  for (let i = 0; i < 7; i++) {
    n += dayDoneCount(isoOf(addDays(monday, i)));
  }
  return n;
}

function monthPerfectCount(year, month) {
  const last = new Date(year, month + 1, 0).getDate();
  let n = 0;
  for (let i = 1; i <= last; i++) {
    if (isPerfectDay(isoOf(new Date(year, month, i)))) n++;
  }
  return n;
}

function countPerfectWeeks() {
  const weeks = {};
  Object.keys(S.days).forEach(k => {
    if (!isPerfectDay(k)) return;
    weeks[weekKeyOf(dateFromKey(k))] = true;
  });
  let n = 0;
  Object.keys(weeks).forEach(wk => {
    if (weekPerfectCount(wk) >= 7) n++;
  });
  return n;
}

function countPerfectMonths() {
  const months = {};
  Object.keys(S.days).forEach(k => {
    if (isPerfectDay(k)) months[monthKeyOf(dateFromKey(k))] = true;
  });
  let n = 0;
  Object.keys(months).forEach(mk => {
    const parts = mk.split('-').map(Number);
    if (monthPerfectCount(parts[0], parts[1] - 1) >= S.settings.monthGoal) n++;
  });
  return n;
}

function countEarlyWakes() {
  const target = S.settings.wakeTarget || '07:00';

  return n;

let audioCtx = null;

function ensureAudio() {
  if (!GLOBAL_SETTINGS.sound) return null;
  try {
    if (!audioCtx) {
      const Ctx = window.AudioContext || window.webkitAudioContext;
      if (!Ctx) return null;
      audioCtx = new Ctx();
    }
    if (audioCtx.state === 'suspended') audioCtx.resume();
    return audioCtx;
  } catch (e) {
    return null;
  }
}

function tone(freq, duration, type, gain) {
  const ctx = ensureAudio();
  if (!ctx) return;
  try {
    const osc = ctx.createOscillator();
    const g = ctx.createGain();
    osc.type = type || 'sine';
    osc.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(gain || 0.15, ctx.currentTime + 0.015);
    g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + duration);
    osc.connect(g);
    g.connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + duration + 0.03);
  } catch (e) { /* ignore */ }
}

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.floor(window.innerWidth * dpr);
    canvas.height = Math.floor(window.innerHeight * dpr);
    canvas.style.width = window.innerWidth + 'px';
    canvas.style.height = window.innerHeight + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  resize();
  window.addEventListener('resize', resize);

  const COLORS = [
    '#ff7eb3', '#b48eff', '#ffc93c', '#4ade80',
    '#5eb8ff', '#ff8a65', '#ffffff', '#ff6b81',
    '#c284ff', '#6bd8ff', '#5cffa8', '#ffe066',
  ];

  function spawn(n, opts) {
    opts = opts || {};
    const ox = opts.x != null ? opts.x : window.innerWidth / 2;
    const oy = opts.y != null ? opts.y : window.innerHeight * 0.32;
    const spread = opts.spread || 1;
    for (let i = 0; i < n; i++) {
      const angle = Math.random() * Math.PI * 2;
      const speed = (2 + Math.random() * 9) * spread;
      particles.push({
        x: ox,
        y: oy,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed - 5,
        size: 5 + Math.random() * 8,
        color: COLORS[Math.floor(Math.random() * COLORS.length)],
        rot: Math.random() * Math.PI * 2,
        vr: (Math.random() - 0.5) * 0.3,
        life: 1,
        decay: 0.007 + Math.random() * 0.008,
        shape: Math.random() < 0.35 ? 'circle' : 'rect',
      });
    }
    if (!running) {
      running = true;
      requestAnimationFrame(loop);
    }
  }

  function loop() {
    ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.vy += 0.25;
      p.vx *= 0.992;
      p.x += p.vx;
      p.y += p.vy;
      p.rot += p.vr;
      p.life -= p.decay;
      if (p.life <= 0 || p.y > window.innerHeight + 60) {
        particles.splice(i, 1);
        continue;
      }
      ctx.save();
      ctx.globalAlpha = Math.max(0, p.life);
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.fillStyle = p.color;
      if (p.shape === 'circle') {
        ctx.beginPath();
        ctx.arc(0, 0, p.size / 2, 0, Math.PI * 2);
        ctx.fill();
      } else {
        ctx.fillRect(-p.size / 2, -p.size / 3, p.size, p.size * 0.66);
      }
      ctx.restore();
    }
    if (particles.length) {
      requestAnimationFrame(loop);
    } else {
      running = false;
      ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
    }
  }

  return {
    burst(n, opts) { spawn(n || 80, opts || {}); },
    big() {
      spawn(140, { spread: 1.3 });
      setTimeout(() => spawn(90, { x: window.innerWidth * 0.15, y: window.innerHeight * 0.25 }), 180);
      setTimeout(() => spawn(90, { x: window.innerWidth * 0.85, y: window.innerHeight * 0.25 }), 340);
      setTimeout(() => spawn(60, { y: window.innerHeight * 0.5, spread: 1.1 }), 520);
    },
    star(x, y) { spawn(30, { x, y, spread: 0.7 }); },
    mega() {
      spawn(200, { spread: 1.5 });
      setTimeout(() => spawn(150, { x: window.innerWidth * 0.1, y: window.innerHeight * 0.2 }), 150);
      setTimeout(() => spawn(150, { x: window.innerWidth * 0.9, y: window.innerHeight * 0.2 }), 300);
      setTimeout(() => spawn(150, { y: window.innerHeight * 0.6, spread: 1.3 }), 450);
    },
  };
})();

function toast(message, icon, ms, variant) {
  const stack = $('#toast-stack');
  if (!stack) return;
  const el = document.createElement('div');
  el.className = 'toast' + (variant ? ' ' + variant : '');
  el.innerHTML =
    (icon ? '<span>' + escapeHtml(icon) + '</span>' : '') +

  setTimeout(() => {

    setTimeout(() => el.remove(), 350);
  }, duration);

function openModal(html, opts) {
  opts = opts || {};
  const overlay = $('#modal-overlay');
  overlay.innerHTML = '<div class="modal-box">' + html + '</div>';
  overlay.classList.add('show');
  MODAL_STATE = { opts, overlay };

  const box = overlay.querySelector('.modal-box');

  const closeBtn = box.querySelector('[data-modal-close]');
  if (closeBtn) {
    closeBtn.addEventListener('click', closeModal);
  }

  if (opts.autofocus !== false) {
    const firstInput = box.querySelector('input, select, textarea');
    if (firstInput) setTimeout(() => firstInput.focus(), 320);
  }

  if (opts.onOpen) opts.onOpen(box);
}

function closeModal() {
  const overlay = $('#modal-overlay');
  overlay.classList.remove('show');
  MODAL_STATE = null;
  setTimeout(() => { overlay.innerHTML = ''; }, 320);
}

function openSheet(html, opts) {
  opts = opts || {};
  const overlay = $('#sheet-overlay');
  overlay.innerHTML = '<div class="sheet">' + (opts.handle !== false ? '<div class="sheet-handle"></div>' : '') + html + '</div>';
  overlay.classList.add('show');
  SHEET_STATE = { opts, overlay };

  const sheet = overlay.querySelector('.sheet');
  const closeBtn = sheet.querySelector('[data-modal-close]');
  if (closeBtn) closeBtn.addEventListener('click', closeSheet);
  if (opts.onOpen) opts.onOpen(sheet);
}

function closeSheet() {
  const overlay = $('#sheet-overlay');
  overlay.classList.remove('show');
  SHEET_STATE = null;
  setTimeout(() => { overlay.innerHTML = ''; }, 320);
}

document.addEventListener('click', e => {
  if (e.target.id === 'modal-overlay') closeModal();
  if (e.target.id === 'sheet-overlay') closeSheet();
});

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if (MODAL_STATE) closeModal();
    if (SHEET_STATE) closeSheet();
  }
});

/* ============================================================================
 * SECTION 12: CURRENCY & LEVEL SYSTEM
 * ============================================================================ */

function addCoins(n) {
  S.currencies.coins = (S.currencies.coins || 0) + n;
  S.profileStats.totalEarnedCoins = (S.profileStats.totalEarnedCoins || 0) + n;
  saveState();
}

function addGems(n) {
  S.currencies.gems = (S.currencies.gems || 0) + n;
  S.profileStats.totalEarnedGems = (S.profileStats.totalEarnedGems || 0) + n;
  saveState();
}

function addXP(n) {
  S.xp = (S.xp || 0) + n;
  const oldLevel = S.level;
  const info = levelInfo(S.xp);
  S.level = info.level;
  S.profileStats.level = info.level;
  if (info.level > oldLevel) {
    // Award skill points
    S.skillPoints += (info.level - oldLevel);
    onLevelUp(info.level);
  }
  saveState();
}

function addPoints(n) {
  S.spentPoints = Math.max(0, S.spentPoints - n);
  addXP(n);
  addCoins(Math.floor(n * 0.5));
  saveState();
}

function spendPoints(n) {
  S.spentPoints += n;
  saveState();
}

function spendCoins(n) {
  if (S.currencies.coins < n) return false;
  S.currencies.coins -= n;
  S.spentCoins = (S.spentCoins || 0) + n;
  saveState();
  return true;
}

function spendGems(n) {
  if (S.currencies.gems < n) return false;
  S.currencies.gems -= n;
  S.spentGems = (S.spentGems || 0) + n;
  saveState();
  return true;
}

function onLevelUp(newLevel) {
  SFX.levelUp();
  Confetti.big();
  toast(t('levelUp', { n: newLevel }), '🎉', 3000, 'reward');
  pushHistory({ type: 'levelup', text: 'Niveau ' + newLevel, icon: '🎉' });
  checkAchievements();
}

function updateCombo() {
  const now = Date.now();
  const last = S.comboLastTaskAt ? new Date(S.comboLastTaskAt).getTime() : 0;
  const window = 60 * 1000; // 60 seconds window
  if (now - last <= window) {
    S.currentCombo = (S.currentCombo || 0) + 1;
  } else {
    S.currentCombo = 1;
  }
  if (S.currentCombo > S.maxCombo) S.maxCombo = S.currentCombo;
  S.comboLastTaskAt = new Date().toISOString();
  if (S.currentCombo >= 3) {
    showComboIndicator(S.currentCombo);
  }
}

function showComboIndicator(n) {
  const existing = $('.combo-indicator');
  if (existing) existing.remove();
  const el = document.createElement('div');
  el.className = 'combo-indicator';
  el.innerHTML = '🔥 Combo x' + n;
  document.body.appendChild(el);
  SFX.combo();
  setTimeout(() => {
    if (el.parentNode) el.remove();
  }, 2500);
}

/* ============================================================================
 * SECTION 14: QUEST SYSTEM
 * ============================================================================ */

function refreshQuests() {
  const now = new Date();
  const today = isoOf(now);
  const thisWeek = weekKeyOf(now);
  const thisMonth = monthKeyOf(now);

  // Daily refresh
  if (S.quests.lastRefreshDaily !== today) {
    S.quests.daily = generateQuests('daily', 3);
    S.quests.lastRefreshDaily = today;
  }
  // Weekly refresh
  if (S.quests.lastRefreshWeekly !== thisWeek) {
    S.quests.weekly = generateQuests('weekly', 2);
    S.quests.lastRefreshWeekly = thisWeek;
  }
  // Monthly refresh
  if (S.quests.lastRefreshMonthly !== thisMonth) {
    S.quests.monthly = generateQuests('monthly', 1);
    S.quests.lastRefreshMonthly = thisMonth;
  }

  saveState();
}

function generateQuests(type, count) {
  const pool = QUESTS_TEMPLATES.filter(q => q.type === type);
  const picked = [];
  const used = new Set();
  let attempts = 0;
  while (picked.length < count && attempts < 50) {
    const q = pool[Math.floor(Math.random() * pool.length)];
    if (!used.has(q.id)) {
      used.add(q.id);
      picked.push({
        ...q,
        progress: 0,
        completed: false,
        claimed: false,
        instanceId: 'qi_' + uid(),
        generatedAt: new Date().toISOString(),
      });
    }
    attempts++;
  }
  return picked;
}

function getQuestProgress(quest) {
  const key = todayKey();
  const monday = weekKeyOf(new Date());
  const year = new Date().getFullYear();
  const month = new Date().getMonth();
  switch (quest.metric) {
    case 'tasksToday': return dayDoneCount(key);
    case 'perfectToday': return isPerfectDay(key) ? 1 : 0;
    case 'earlyWakeToday': return countEarlyWakeToday();
    case 'speedToday': return countSpeedToday();
    case 'comboToday': return S.currentCombo || 0;
    case 'perfectWeek': return weekPerfectCount(monday);
    case 'tasksWeek': return weekTasksCount(monday);
    case 'perfectMonth': return monthPerfectCount(year, month);
    default: return 0;
  }
}

function updateQuests() {
  const allQuests = [...S.quests.daily, ...S.quests.weekly, ...S.quests.monthly];
  let changed = false;
  allQuests.forEach(q => {
    if (q.claimed) return;
    const progress = getQuestProgress(q);
    if (progress !== q.progress) {
      q.progress = progress;
      changed = true;
    }
    if (progress >= q.target && !q.completed) {
      q.completed = true;
      changed = true;
      toast(t('questComplete'), '📜', 2200);
    }
  });
  if (changed) saveState();
}

function claimQuest(instanceId) {
  const allGroups = [S.quests.daily, S.quests.weekly, S.quests.monthly];
  for (const group of allGroups) {
    const q = group.find(x => x.instanceId === instanceId);
    if (!q) continue;
    if (!q.completed || q.claimed) return;
    q.claimed = true;
    if (!S.quests.completedIds.includes(instanceId)) {
      S.quests.completedIds.push(instanceId);
    }
    if (q.rewardCoins) addCoins(q.rewardCoins);
    if (q.rewardGems) addGems(q.rewardGems);
    if (q.rewardXP) addXP(q.rewardXP);
    SFX.reward();
    Confetti.burst(80, { y: window.innerHeight * 0.4 });
    toast('📜 ' + L(q.title) + ' ✓', '✅', 2200, 'success');
    pushHistory({ type: 'quest', text: L(q.title), icon: '📜', delta: q.rewardCoins || 0 });
    checkAchievements();
    saveState();
    render();
    return;
  }
}

/* ============================================================================
 * SECTION 15: LOOT SYSTEM
 * ============================================================================ */

function openChest(type) {
  const costs = {
    wood: { coins: 80 },
    silver: { coins: 200 },
    gold: { gems: 5 },
    diamond: { gems: 15 },
  };
  const cost = costs[type];
  if (!cost) return;
  if (cost.coins && S.currencies.coins < cost.coins) {
    SFX.error();
    toast(t('notEnough'), '😅', 1800);
    return;
  }
  if (cost.gems && S.currencies.gems < cost.gems) {
    SFX.error();
    toast(t('notEnough'), '😅', 1800);
    return;
  }

  if (cost.coins) spendCoins(cost.coins);
  if (cost.gems) spendGems(cost.gems);

  const boostByType = { wood: 0, silver: 0.5, gold: 1.5, diamond: 3 };
  const rarity = pickRarity(boostByType[type] || 0);

  // Determine reward based on rarity
  const rewards = generateLootRewards(rarity, type);
  S.loot.chestsOpened = (S.loot.chestsOpened || 0) + 1;
  S.loot.lastChestAt = new Date().toISOString();

  // Apply rewards
  rewards.forEach(r => {
    if (r.type === 'coins') addCoins(r.amount);
    if (r.type === 'gems') addGems(r.amount);
    if (r.type === 'xp') addXP(r.amount);
    if (r.type === 'card') {
      if (!S.collection.cards[r.id]) {
        S.collection.cards[r.id] = 1;
        S.collection.discoveredAt[r.id] = new Date().toISOString();
      } else {
        S.collection.cards[r.id]++;
      }
    }
    if (r.type === 'pet') {
      if (!S.pets.owned[r.id]) {
        S.pets.owned[r.id] = { level: 1, xp: 0, adoptedAt: new Date().toISOString() };
      }
    }
    if (r.type === 'item') {
      S.inventory[r.id] = (S.inventory[r.id] || 0) + r.amount;
    }
  });

  SFX.chest();
  Confetti.big();
  pushHistory({ type: 'chest', text: type + ' chest', icon: '📦' });
  saveState();
  checkAchievements();
  showLootRewardModal(rewards, rarity, type);
}

function generateLootRewards(rarity, chestType) {
  const rewards = [];
  const rarityIndex = RARITY_ORDER.indexOf(rarity);

  // Base coins
  const coinBase = { wood: 20, silver: 60, gold: 150, diamond: 400 }[chestType] || 20;
  const coinMult = 1 + rarityIndex * 0.6;
  rewards.push({ type: 'coins', amount: Math.round(coinBase * coinMult) });

  // Gems for rare+
  if (rarityIndex >= 2) {
    rewards.push({ type: 'gems', amount: Math.max(1, Math.floor(rarityIndex * 1.5)) });
  }

  // XP always
  rewards.push({ type: 'xp', amount: Math.round(15 * (1 + rarityIndex * 0.5)) });

  // Card (rare+ only)
  if (rarityIndex >= 2 && Math.random() < 0.7) {
    const pool = COLLECTION_CARDS.filter(c => RARITY_ORDER.indexOf(c.rarity) <= rarityIndex);
    if (pool.length) {
      const card = pool[Math.floor(Math.random() * pool.length)];
      rewards.push({ type: 'card', id: card.id, icon: card.icon, name: L(card.name), rarity: card.rarity });
    }
  }

  // Pet (epic+)
  if (rarityIndex >= 3 && Math.random() < 0.4) {
    const pool = PETS.filter(p => RARITY_ORDER.indexOf(p.rarity) <= rarityIndex);
    if (pool.length) {
      const pet = pool[Math.floor(Math.random() * pool.length)];
      rewards.push({ type: 'pet', id: pet.id, icon: pet.icon, name: L(pet.name), rarity: pet.rarity });
    }
  }

  return rewards;
}

function showLootRewardModal(rewards, rarity, chestType) {
  const rarityInfo = getRarityInfo(rarity);
  const rewardsHTML = rewards.map(r => {
    if (r.type === 'coins') return '<div class="row gap-sm" style="padding:6px 0"><span style="font-size:22px">💰</span><span class="grow bold">' + r.amount + ' ' + escapeHtml(t('coins')) + '</span></div>';
    if (r.type === 'gems') return '<div class="row gap-sm" style="padding:6px 0"><span style="font-size:22px">💎</span><span class="grow bold">' + r.amount + ' ' + escapeHtml(t('gems')) + '</span></div>';
    if (r.type === 'xp') return '<div class="row gap-sm" style="padding:6px 0"><span style="font-size:22px">⚡</span><span class="grow bold">' + r.amount + ' XP</span></div>';
    if (r.type === 'card') return '<div class="row gap-sm" style="padding:6px 0"><span style="font-size:22px">' + r.icon + '</span><span class="grow bold">' + escapeHtml(r.name) + '</span><span class="badge">' + escapeHtml(L(getRarityInfo(r.rarity).label)) + '</span></div>';
    if (r.type === 'pet') return '<div class="row gap-sm" style="padding:6px 0"><span style="font-size:22px">' + r.icon + '</span><span class="grow bold">' + escapeHtml(r.name) + '</span><span class="badge">' + escapeHtml(L(getRarityInfo(r.rarity).label)) + '</span></div>';
    return '';
  }).join('');

  const html =
    '<div class="loot-reveal">' +
      '<div class="loot-item">' + (chestType === 'wood' ? '📦' : chestType === 'silver' ? '🥈' : chestType === 'gold' ? '🥇' : '💎') + '</div>' +
      '<div class="loot-name">' + escapeHtml(L(rarityInfo.label)) + '</div>' +
      '<div class="loot-rarity ' + rarity + '">' + escapeHtml(L(rarityInfo.label)) + '</div>' +
    '</div>' +
    '<hr class="divider">' +
    '<div class="bold mb-sm">' + escapeHtml(t('chestReward')) + ' :</div>' +
    rewardsHTML +
    '<div class="modal-actions"><button class="btn primary" data-modal-close>' + escapeHtml(t('chestContinue')) + '</button></div>';

  openModal(html, { autofocus: false });
}

function adoptPet(petId) {
  const pet = PETS.find(p => p.id === petId);
  if (!pet) return;
  if (S.pets.owned[petId]) {
    // Select as active
    S.pets.activeId = petId;
    SFX.pet();
    toast('🐾 ' + L(pet.name) + ' ✓', '🐾', 2000);
    saveState();
    render();
    return;
  }
  if (S.currencies.coins < pet.baseCost) {
    SFX.error();
    toast(t('notEnough'), '😅', 1800);
    return;
  }
  spendCoins(pet.baseCost);
  S.pets.owned[petId] = { level: 1, xp: 0, adoptedAt: new Date().toISOString(), hunger: 100, happy: 100 };
  S.pets.activeId = petId;
  SFX.pet();
  Confetti.burst(60, { y: window.innerHeight * 0.4 });
  toast('🐾 ' + L(pet.name) + ' ✓', '🐾', 2200);
  pushHistory({ type: 'pet', text: L(pet.name), icon: pet.icon });
  checkAchievements();
  saveState();
  render();
}

function feedPet() {
  const petId = S.pets.activeId;
  if (!petId || !S.pets.owned[petId]) return;
  const pet = S.pets.owned[petId];

  if (S.currencies.coins < cost) {

    toast(t('notEnough'), '😅', 1800);

function playPet() {

/* ============================================================================
 * SECTION 17: SPIN WHEEL
   ============================================================================ */

const SPIN_REWARDS = [
  { icon: '💰', type: 'coins', amount: 25, weight: 25 },
  { icon: '💰', type: 'coins', amount: 50, weight: 20 },
  { icon: '💰', type: 'coins', amount: 100, weight: 12 },
  { icon: '💎', type: 'gems', amount: 1, weight: 15 },
  { icon: '💎', type: 'gems', amount: 3, weight: 8 },
  { icon: '⚡', type: 'xp', amount: 30, weight: 12 },
  { icon: '📦', type: 'chest', amount: 1, weight: 5 },
  { icon: '🍀', type: 'boost', amount: 1, weight: 3 },
];

function canSpin() {
  if (!S.spin.lastSpinAt) return true;
  const last = new Date(S.spin.lastSpinAt).getTime();
  const now = Date.now();
  return (now - last) >= 24 * 60 * 60 * 1000;
}

function doSpin() {
  if (!canSpin()) {
    SFX.error();
    toast(t('spinNext', { t: fmtCountdown(24 * 60 * 60 * 1000 - (Date.now() - new Date(S.spin.lastSpinAt).getTime())) }), '⏳', 2000);
    return;
  }

  const wheel = $('#wheel-disc');
  if (wheel) {
    const rotations = 5 + Math.random() * 3;
    const finalDeg = Math.random() * 360 + rotations * 360;
    wheel.style.transform = 'rotate(' + finalDeg + 'deg)';
    SFX.spin();
    setTimeout(() => {
      const reward = weightedRandom(SPIN_REWARDS, 'weight');
      applySpinReward(reward);
    }, 4200);
  }
}

function applySpinReward(reward) {
  S.spin.lastSpinAt = new Date().toISOString();
  S.spin.spinsUsed = (S.spin.spinsUsed || 0) + 1;
  S.spin.totalSpins = (S.spin.totalSpins || 0) + 1;

  if (reward.type === 'coins') addCoins(reward.amount);

function toggleTask(taskId, dayKey) {
  const task = S.tasks.find(x => x.id === taskId);
  if (!task) return;
  const key = dayKey || todayKey();
  const day = getDayData(key, true);
  const wasPerfect = isPerfectDay(key);

  if (day.done[taskId]) {
    delete day.done[taskId];
    SFX.uncheck();
    toast(t('taskUndone'), '↩️', 1200);
    pushHistory({ type: 'uncheck', text: L(task.label), icon: task.icon });
    S.currentCombo = 0;
  } else {
    day.done[taskId] = {
      at: new Date().toISOString(),
      points: task.points || 0,
      bonus: 0,
      sec: null,
    };
    updateCombo();

    // Combo multiplier
    let points = task.points || 0;
    let comboBonus = 0;
    if (S.currentCombo >= 3) {
      comboBonus = Math.floor(S.currentCombo / 3);
      points += comboBonus;
    }

    day.done[taskId].points = points;
    day.done[taskId].comboBonus = comboBonus;

    SFX.check();
    toast(t('earnedPoints', { n: points }), '✨', 1300);
    addXP(points);
    addCoins(Math.floor(points * 0.5));
    pushHistory({
      type: 'check',
      text: L(task.label),
      icon: task.icon,
      delta: points,
    });

    // Early morning / late night detection
    const hour = new Date().getHours();
    if (hour < 6) S.earlyMorningTask = true;
    if (hour >= 21) S.lateNightTask = true;
  }

  const nowPerfect = isPerfectDay(key);
  if (!wasPerfect && nowPerfect) {
    onPerfectDay(key);
  } else if (wasPerfect && !nowPerfect) {
    toast(t('taskUndone'), '💫', 1300);
  }

  updateQuests();
  checkAchievements();
  saveState();
  render();
}

function onPerfectDay(key) {
  SFX.star();
  toast(t('perfectDay'), '⭐', 2400);
  setTimeout(() => Confetti.burst(80, { y: window.innerHeight * 0.25 }), 60);
  addCoins(50);
  addGems(1);

  const wk = weekKeyOf(dateFromKey(key));
  const count = weekPerfectCount(wk);
  if (count >= 7 && !S.claimedWeeks[wk]) {
    setTimeout(() => {
      SFX.reward();
      Confetti.big();
      toast(t('boxUnlocked'), '🎁', 3000, 'reward');
    }, 700);
  }

  const d = dateFromKey(key);
  const mk = monthKeyOf(d);
  if (monthPerfectCount(d.getFullYear(), d.getMonth()) >= S.settings.monthGoal && !S.claimedMonths[mk]) {
    setTimeout(() => {
      SFX.reward();
      Confetti.big();
      toast(t('monthUnlocked'), '🏆', 3200, 'reward');
    }, 1200);
  }
}

function startTimer(taskId) {
  S.timers[taskId] = Date.now();
  SFX.start();
  saveState();
  render();
}

function stopTimer(taskId) {
  const started = S.timers[taskId];
  if (!started) return;
  const elapsed = (Date.now() - started) / 1000;
  delete S.timers[taskId];

  const task = S.tasks.find(x => x.id === taskId);
  if (!task) { saveState(); render(); return; }

  const key = todayKey();
  const day = getDayData(key, true);
  const wasPerfect = isPerfectDay(key);

  const target = task.target || 900;
  const bonus = elapsed <= target ? 1 : 0;

  day.done[taskId] = {
    at: new Date().toISOString(),
    points: task.points || 0,
    bonus,
    sec: Math.round(elapsed),
  };

  if (bonus) {
    SFX.check();
    setTimeout(() => SFX.star(), 160);
    toast(t('speedBonusToast'), '⚡', 1900);
    Confetti.star(window.innerWidth / 2, window.innerHeight * 0.4);
  } else {
    SFX.check();
    toast(t('earnedPoints', { n: task.points || 0 }), '✨', 1400);
  }

  const points = (task.points || 0) + bonus;
  addXP(points);
  addCoins(Math.floor(points * 0.5));

  updateCombo();

  pushHistory({
    type: 'timer',
    text: L(task.label),
    icon: task.icon,
    delta: points,
    sec: Math.round(elapsed),
  });

  if (!wasPerfect && isPerfectDay(key)) onPerfectDay(key);

  updateQuests();
  checkAchievements();
  saveState();
  render();
}

const BP_TIERS = (() => {
  const tiers = [];
  for (let i = 1; i <= 30; i++) {
    const rewards = [];
    if (i % 5 === 0) {
      rewards.push({ icon: '💎', type: 'gems', amount: 5 });
    } else if (i % 3 === 0) {
      rewards.push({ icon: '📦', type: 'chest', amount: 1 });
    } else {
      rewards.push({ icon: '💰', type: 'coins', amount: 50 + i * 10 });
    }
    tiers.push({ tier: i, xpNeeded: i * 100, rewards });
  }
  return tiers;
})();

function getBPTier() {
  const xp = S.battlePass.xp || 0;
  let tier = 1;
  for (const t of BP_TIERS) {
    if (xp >= t.xpNeeded) tier = t.tier + 1;
  }
  return Math.min(tier, BP_TIERS.length);
}

function claimBPTier(tierNum) {
  if (S.battlePass.claimedTiers.includes(tierNum)) return;
  const currentTier = getBPTier();
  if (tierNum > currentTier - 1) return;
  S.battlePass.claimedTiers.push(tierNum);
  const tier = BP_TIERS.find(t => t.tier === tierNum);
  if (!tier) return;
  tier.rewards.forEach(r => {
    if (r.type === 'coins') addCoins(r.amount);
    if (r.type === 'gems') addGems(r.amount);
    if (r.type === 'chest') {
      for (let i = 0; i < r.amount; i++) {
        const loot = generateLootRewards('rare', 'silver');
        loot.forEach(l => {
          if (l.type === 'coins') addCoins(l.amount);
          if (l.type === 'gems') addGems(l.amount);
        });
      }
    }
  });
  SFX.reward();
  Confetti.burst(60, { y: window.innerHeight * 0.4 });
  toast('Palier ' + tierNum + ' ✓', '🎖️', 2000, 'success');
  saveState();
  render();
}

function ringSvg(pct, size) {
  size = size || 52;
  const stroke = size > 100 ? 11 : (size > 60 ? 9 : 7);
  const R = size / 2 - stroke / 2 - 3;
  const C = 2 * Math.PI * R;
  const off = C * (1 - clamp(pct, 0, 1));
  return (
    '<svg viewBox="0 0 ' + size + ' ' + size + '" width="' + size + '" height="' + size + '" aria-hidden="true">' +
      '<circle class="ring-bg" cx="' + (size / 2) + '" cy="' + (size / 2) + '" r="' + R + '" stroke-width="' + stroke + '"/>' +
      '<circle class="ring-fg" cx="' + (size / 2) + '" cy="' + (size / 2) + '" r="' + R + '" stroke-width="' + stroke + '" ' +
        'stroke-dasharray="' + C.toFixed(2) + '" ' +
        'stroke-dashoffset="' + off.toFixed(2) + '"/>' +
    '</svg>'
  );
}

function progressBarHTML(pct, variant) {
  return '<div class="progress-bar ' + (variant || '') + '"><div class="fill" style="width:' + clamp(pct * 100, 0, 100) + '%"></div></div>';
}

function progressBarCompact(pct, variant, big) {
  return '<div class="progress-bar ' + (big ? 'lg' : 'sm') + ' ' + (variant || '') + '"><div class="fill" style="width:' + clamp(pct * 100, 0, 100) + '%"></div></div>';
}

function badge(text, variant) {
  return '<span class="badge ' + (variant || '') + '">' + escapeHtml(text) + '</span>';
}

function currencyChip(type, value) {
  const icons = { coins: '💰', gems: '💎', xp: '⚡', tokens: '🎫' };
  return '<div class="currency-chip ' + type + '"><span class="ico">' + icons[type] + '</span><span class="tabular">' + value + '</span></div>';
}

/* ============================================================================
 * SECTION 27: RENDER — TASKS
   ============================================================================ */

function renderTaskRow(task, key) {
  const day = S.days[key] || { done: {} };
  const entry = day.done[task.id];
  const isDone = !!entry;
  const running = !!S.timers[task.id];
  const isTimer = task.type === 'timer';

  let cls = 'task difficulty-' + (task.difficulty || 'medium');
  if (isDone) cls += ' done';
  if (running) cls += ' timer-running';

  let meta = badge('+' + task.points + ' ' + t('point'), 'points');

  if (isTimer) {
    const targetMin = Math.round((task.target || 900) / 60);
    meta += badge('⏱ ' + targetMin + ' min');
  }
  if (task.id === 'wake' && S.settings.wakeTarget) {
    meta += badge('🌅 ' + S.settings.wakeTarget);
  }
  if (isDone && entry.sec) {
    meta += badge(t('took', { t: fmtDurationLong(entry.sec) }), 'success');
  }
  if (isDone && entry.bonus) {
    meta += badge('⚡ +' + entry.bonus, 'bonus');
  }
  if (isDone && entry.comboBonus) {
    meta += badge('🔥 +' + entry.comboBonus, 'bonus');
  }

  let right;
  if (running) {
    right = '<span class="task-timer" data-timer="' + escapeHtml(task.id) + '">0:00</span>';
  } else {
    right = '<span class="task-check">✓</span>';
  }

  return (
    '<button class="' + cls + '" data-action="task" data-task="' + escapeHtml(task.id) + '" data-day="' + escapeHtml(key) + '">' +
      '<span class="task-icon">' + escapeHtml(task.icon) + '</span>' +
      '<span class="task-body">' +
        '<span class="task-label">' + escapeHtml(L(task.label)) + '</span>' +
        '<span class="task-meta">' + meta + '</span>' +
      '</span>' +
      '<span class="task-right">' + right + '</span>' +
    '</button>'
  );
}

function renderDayCell(date) {
  const key = isoOf(date);
  const perfect = isPerfectDay(key);
  const done = dayDoneCount(key);
  const isToday = key === todayKey();
  const future = date > startOfDay(new Date());
  const partial = !perfect && done > 0;
  const missed = !perfect && !partial && date < startOfDay(new Date());

  let cls = 'day-cell';
  if (perfect) cls += ' perfect';
  else if (partial) cls += ' partial';
  else if (missed) cls += ' past-missed';
  if (isToday) cls += ' today';
  if (future) cls += ' future';

  const mark = perfect ? '⭐' : (partial ? '•' : '');

  return (
    '<button class="' + cls + '" data-action="open-day" data-day="' + escapeHtml(key) + '">' +
      '<div class="dname">' + escapeHtml(weekdayShort(date)) + '</div>' +
      '<div class="dnum">' + date.getDate() + '</div>' +
      '<div class="dmark">' + mark + '</div>' +
      (partial ? '<span class="ddot"></span>' : '') +
    '</button>'
  );
}

VIEWS.month = function () {
  const now = new Date();
  const y = now.getFullYear();
  const m = now.getMonth();
  const mk = y + '-' + pad2(m + 1);
  const goal = S.settings.monthGoal;
  const count = monthPerfectCount(y, m);
  const claimed = !!S.claimedMonths[mk];
  const unlocked = count >= goal;

  const monthName = new Date(y, m, 1).toLocaleDateString(LANG === 'fr' ? 'fr-FR' : 'en-US', {
    month: 'long', year: 'numeric',
  });

  const firstDay = new Date(y, m, 1);
  const lastDay = new Date(y, m + 1, 0).getDate();
  const startPad = (firstDay.getDay() + 6) % 7;

  const wdNames = [];
  for (let i = 0; i < 7; i++) {
    wdNames.push('<div class="cal-wd">' + escapeHtml(weekdayShort(addDays(weekStartOf(now), i)).slice(0, 3)) + '</div>');
  }

  let cells = '';
  for (let i = 0; i < startPad; i++) cells += '<div class="cal-cell empty"></div>';
  for (let d = 1; d <= lastDay; d++) {
    const date = new Date(y, m, d);
    const key = isoOf(date);
    const perfect = isPerfectDay(key);
    const done = dayDoneCount(key);
    const isToday = key === todayKey();
    const future = date > startOfDay(new Date());
    const missed = !perfect && done === 0 && date < startOfDay(new Date());
    let cls = 'cal-cell';
    if (perfect) cls += ' perfect';
    else if (done > 0) cls += ' partial';
    else if (missed) cls += ' missed';
    if (isToday) cls += ' today';
    if (future) cls += ' future';
    cells += '<button class="' + cls + '" data-action="open-day" data-day="' + escapeHtml(key) + '">' + d + '</button>';
  }

  const calCard =
    '<div class="card">' +
      '<div class="card-title">' +
        '<span class="emoji">🗓️</span>' +
        '<span style="text-transform:capitalize">' + escapeHtml(monthName) + '</span>' +
      '</div>' +
      '<div class="calendar">' + wdNames.join('') + cells + '</div>' +
    '</div>';

  let prizeHtml;
  if (claimed) {
    prizeHtml =
      '<div class="reward claimed">' +
        '<div class="reward-icon">🏆</div>' +
        '<div class="reward-body">' +
          '<div class="reward-name">' + escapeHtml(t('claimed')) + '</div>' +
          '<div class="reward-desc">' + escapeHtml(t('monthUnlocked')) + '</div>' +
        '</div>' +
      '</div>';
  } else if (unlocked) {
    prizeHtml =
      '<div class="reward unlocked">' +
        '<div class="reward-icon">🏆</div>' +
        '<div class="reward-body">' +
          '<div class="reward-name">' + escapeHtml(t('monthlyPrize')) + '</div>' +
          '<div class="reward-desc">' + escapeHtml(t('monthUnlocked')) + '</div>' +
        '</div>' +
      '</div>' +
      '<button class="btn gold block mt-md" data-action="claim-month" data-month="' + escapeHtml(mk) + '">' +
        '🏆 ' + escapeHtml(t('claim')) +
      '</button>';
  } else {
    prizeHtml =
      '<div class="reward locked">' +
        '<div class="reward-icon">🔒</div>' +
        '<div class="reward-body">' +
          '<div class="reward-name">' + escapeHtml(t('monthlyPrize')) + '</div>' +
          '<div class="reward-desc">' + escapeHtml(t('monthLocked', { n: Math.max(0, goal - count) })) + '</div>' +
        '</div>' +
      '</div>';
  }

  const prizeCard =
    '<div class="card">' +
      '<div class="card-title">' +
        '<span class="emoji">🎯</span>' +
        '<span>' + escapeHtml(t('monthGoal')) + '</span>' +
      '</div>' +
      '<div class="progress-label">' +
        '<span class="lbl">' + escapeHtml(t('perfectDays')) + '</span>' +
        '<span class="val">' + count + ' / ' + goal + '</span>' +
      '</div>' +
      progressBarCompact(count / goal, 'green', true) +
      '<hr class="divider spaced">' +
      prizeHtml +
    '</div>';

  return '<div class="fade-in">' + calCard + prizeCard + '</div>';
};

function renderHeatmap(weeks) {
  weeks = weeks || 12;
  const today = startOfDay(new Date());
  const cells = [];
  const start = addDays(weekStartOf(today), -7 * (weeks - 1));
  for (let i = 0; i < 7 * weeks; i++) {
    const date = addDays(start, i);
    const key = isoOf(date);
    const done = dayDoneCount(key);
    const total = activeTasks().length || 1;
    const ratio = total ? done / total : 0;
    const future = date > today;
    let cls = 'heatmap-cell';
    if (future) cls += ' future';
    else if (ratio >= 1) cls += ' level-4';
    else if (ratio >= 0.75) cls += ' level-3';
    else if (ratio >= 0.5) cls += ' level-2';
    else if (ratio > 0) cls += ' level-1';
    if (key === todayKey()) cls += ' today';
    cells.push('<div class="' + cls + '" title="' + escapeHtml(fmtShortDate(date)) + '"></div>');
  }
  return '<div class="heatmap">' + cells.join('') + '</div>';
}

  const items = S.history.slice(0, 15).map(h => {

/* ----------------------------------------------------------------
 * VIEW: QUESTS
   ---------------------------------------------------------------- */
VIEWS.quests = function () {
  refreshQuests();

  const tabs = [
    { id: 'daily', label: t('questsDaily') },
    { id: 'weekly', label: t('questsWeekly') },
    { id: 'monthly', label: t('questsMonthly') },
  ];

  const tabsHTML = '<div class="tabs-header">' +
    tabs.map(tb => '<button class="tab-btn ' + (CURRENT_TAB === tb.id ? 'active' : '') + '" data-action="switch-quest-tab" data-tab="' + tb.id + '">' + escapeHtml(tb.label) + '</button>').join('') +
    '</div>';

  const quests = S.quests[CURRENT_TAB] || [];

  let questsHTML;
  if (!quests.length) {
    questsHTML = '<div class="empty-state">' +
      '<div class="icon">📜</div>' +
      '<div class="title">' + escapeHtml(t('noQuests')) + '</div>' +
      '</div>';
  } else {
    questsHTML = '<div class="quest-list stagger">' +
      quests.map(q => renderQuest(q)).join('') +
      '</div>';
  }

  // Countdown to refresh
  const now = new Date();
  let refreshMs = 0;
  if (CURRENT_TAB === 'daily') {
    const tomorrow = addDays(startOfDay(now), 1);
    refreshMs = tomorrow.getTime() - now.getTime();
  } else if (CURRENT_TAB === 'weekly') {
    const nextMonday = addDays(weekStartOf(now), 7);
    refreshMs = nextMonday.getTime() - now.getTime();
  } else {
    const nextMonth = new Date(now.getFullYear(), now.getMonth() + 1, 1);
    refreshMs = nextMonth.getTime() - now.getTime();
  }

  const countdownCard = '<div class="card compact center">' +
    '<div class="small muted bold">⏳ ' + escapeHtml(t('refreshIn', { t: fmtCountdown(refreshMs) })) + '</div>' +
  '</div>';

  return '<div class="fade-in">' + tabsHTML + questsHTML + countdownCard + '</div>';
};

function renderQuest(q) {
  const progress = getQuestProgress(q);
  const pct = clamp(progress / q.target, 0, 1);
  const claimed = q.claimed;
  const complete = q.completed || progress >= q.target;

  let cls = 'quest';
  if (complete && !claimed) cls += ' complete';
  if (claimed) cls += ' claimed';

  const rewardsHTML = [];
  if (q.rewardCoins) rewardsHTML.push('<span class="quest-reward">💰 ' + q.rewardCoins + '</span>');
  if (q.rewardGems) rewardsHTML.push('<span class="quest-reward gem">💎 ' + q.rewardGems + '</span>');
  if (q.rewardXP) rewardsHTML.push('<span class="quest-reward xp">⚡ ' + q.rewardXP + '</span>');

  const typeBadge = '<span class="quest-type-badge ' + q.type + '">' + escapeHtml(t('quests' + q.type.charAt(0).toUpperCase() + q.type.slice(1))) + '</span>';

  let actionBtn = '';
  if (!claimed && complete) {
    actionBtn = '<button class="btn sm primary" data-action="claim-quest" data-quest="' + escapeHtml(q.instanceId) + '">' + escapeHtml(t('questClaim')) + '</button>';
  }

  return (
    '<div class="' + cls + '">' +
      '<div class="quest-icon">' + q.icon + '</div>' +
      '<div class="quest-body">' +
        '<div class="row gap-sm between">' +
          '<div class="quest-title grow">' + escapeHtml(L(q.title)) + '</div>' +
          typeBadge +
        '</div>' +
        '<div class="progress-label" style="margin:0">' +
          '<span class="lbl tiny">' + progress + ' / ' + q.target + '</span>' +
        '</div>' +
        progressBarCompact(pct, complete ? 'green' : '') +
        '<div class="quest-rewards">' +
          '<span class="tiny muted bold" style="align-self:center">' + escapeHtml(t('questReward')) + ':</span>' +
          rewardsHTML.join('') +
        '</div>' +
        (actionBtn ? '<div style="margin-top:6px">' + actionBtn + '</div>' : '') +
      '</div>' +
    '</div>'
  );
}

const ALL_TABS = [
  { id: 'today',    icon: '☀️', labelKey: 'tabToday',    view: 'today' },
  { id: 'week',     icon: '📅', labelKey: 'tabWeek',     view: 'week' },
  { id: 'month',    icon: '🗓️', labelKey: 'tabMonth',    view: 'month' },
  { id: 'stats',    icon: '📊', labelKey: 'tabStats',    view: 'stats' },
  { id: 'quests',   icon: '📜', labelKey: 'tabQuests',   view: 'quests' },
  { id: 'shop',     icon: '🛍️', labelKey: 'tabShop',     view: 'shop' },
  { id: 'pets',     icon: '🐾', labelKey: 'tabPets',     view: 'pets' },
  { id: 'rewards',  icon: '🏆', labelKey: 'tabRewards',  view: 'rewards' },
  { id: 'more',     icon: '✨', labelKey: 'tabMore',     view: 'more' },
  { id: 'settings', icon: '⚙️', labelKey: 'tabSettings', view: 'settings' },
];

function render() {
  document.documentElement.className = 'theme-' + GLOBAL_SETTINGS.theme;
  document.documentElement.setAttribute('data-density', GLOBAL_SETTINGS.density);
  document.documentElement.lang = LANG;

  $('#brand-title').textContent = S.profile.name || t('appName');
  const rank = getCurrentRank();
  $('#brand-subtitle').textContent = t('level') + ' ' + S.level + ' · ' + L(rank.name);

  const view = VIEWS[CURRENT_VIEW] || VIEWS.today;
  $('#main-view').innerHTML = view();

  renderTabbar();
  updateTimerDisplays();

  // Update spin button countdown
  updateSpinCountdown();
}

function renderTabbar() {
  // Show first 5 tabs + settings in the fixed bottom bar
  const primaryTabs = ALL_TABS.filter(tb => ['today', 'week', 'stats', 'shop', 'more'].includes(tb.id));

  let html = primaryTabs.map(tb => {
    const active = CURRENT_VIEW === tb.view;
    const badge = getTabBadge(tb.id);
    return (
      '<button class="tab ' + (active ? 'active' : '') + '" data-action="switch-view" data-view="' + tb.view + '">' +
        (badge ? '<span class="' + badge.type + '">' + badge.value + '</span>' : '') +
        '<span class="tab-icon">' + tb.icon + '</span>' +
        '<span class="tab-label">' + escapeHtml(t(tb.labelKey)) + '</span>' +
      '</button>'
    );
  }).join('');

  $('#tabbar').innerHTML = html;
}

function getTabBadge(tabId) {
  if (tabId === 'today') {
    if (canClaimDaily()) return { type: 'badge-dot', value: '' };
    if (canSpin()) return { type: 'badge-dot', value: '' };
  }
  if (tabId === 'week') {
    const wk = weekKeyOf(new Date());
    if (weekPerfectCount(wk) >= 7 && !S.claimedWeeks[wk]) {
      return { type: 'badge-dot', value: '' };
    }
  }
  if (tabId === 'month') {
    const now = new Date();
    const mk = monthKeyOf(now);
    if (monthPerfectCount(now.getFullYear(), now.getMonth()) >= S.settings.monthGoal && !S.claimedMonths[mk]) {
      return { type: 'badge-dot', value: '' };
    }
  }
  if (tabId === 'stats') {
    const completed = [...S.quests.daily, ...S.quests.weekly, ...S.quests.monthly].filter(q => q.completed && !q.claimed).length;
    if (completed > 0) return { type: 'badge-count', value: completed };
  }
  return null;
}

function updateTimerDisplays() {
  const ids = Object.keys(S.timers);
  if (!ids.length) return;
  ids.forEach(id => {
    const el = document.querySelector('[data-timer="' + id + '"]');
    if (!el) return;
    const elapsed = (Date.now() - S.timers[id]) / 1000;
    el.textContent = fmtDuration(elapsed);
    const task = S.tasks.find(x => x.id === id);
    const target = task && task.target ? task.target : 900;
    const row = el.closest('.task');
    if (row) {
      if (elapsed > target) row.classList.add('timer-over');
      else row.classList.remove('timer-over');
    }
  });
}

setInterval(updateTimerDisplays, 500);

function updateSpinCountdown() {
  const btn = $('#wheel-spin-btn');
  if (!btn) return;
  if (canSpin()) {
    btn.disabled = false;
    btn.textContent = '🎡 ' + t('spinFree');
  } else {
    btn.disabled = true;
    const remaining = 24 * 60 * 60 * 1000 - (Date.now() - new Date(S.spin.lastSpinAt).getTime());
    btn.textContent = '⏳ ' + t('spinNext', { t: fmtCountdown(remaining) });
  }
}

setInterval(() => {
  if (CURRENT_VIEW === 'more') updateSpinCountdown();
}, 1000);

/* ============================================================================
 * SECTION 30: EVENT HANDLING
   ============================================================================ */

document.addEventListener('click', function (e) {
  const el = e.target.closest('[data-action]');
  if (!el) return;
  const action = el.dataset.action;

  switch (action) {
    case 'switch-view': {
      const v = el.dataset.view;
      if (VIEWS[v]) {
        CURRENT_VIEW = v;
        CURRENT_TAB = defaultTabForView(v);
        render();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
      break;
    }

    case 'task': {
      const taskId = el.dataset.task;
      const dayKey = el.dataset.day || todayKey();
      const task = S.tasks.find(x => x.id === taskId);
      if (!task) break;
      if (task.type === 'timer') {
        if (S.timers[taskId]) {
          stopTimer(taskId);
        } else if (S.days[dayKey] && S.days[dayKey].done[taskId]) {
          toggleTask(taskId, dayKey);
        } else {
          startTimer(taskId);
        }
      } else {
        toggleTask(taskId, dayKey);
      }
      break;
    }

    case 'open-day': {
      openDayDetail(el.dataset.day);
      break;
    }

    case 'claim-week':
      claimWeek(el.dataset.week);
      break;

    case 'claim-month':
      claimMonth(el.dataset.month);
      break;

    case 'claim-quest':
      claimQuest(el.dataset.quest);
      break;

    case 'claim-bp':
      claimBPTier(parseInt(el.dataset.tier, 10));
      break;

    case 'claim-daily':
      claimDailyLogin();
      break;

    case 'spin-wheel':
      doSpin();
      break;

    case 'unlock-skill':
      unlockSkill(el.dataset.node);
      break;

    case 'craft':
      craftRecipe(el.dataset.recipe);
      break;

    case 'buy-shop':
      buyShopItem(el.dataset.item);
      break;

    case 'buy':
      buyReward(el.dataset.reward);
      break;

    case 'adopt-pet':
      adoptPet(el.dataset.pet);
      break;

    case 'feed-pet':
      feedPet();
      break;

    case 'play-pet':
      playPet();
      break;

    case 'equip-title':
      equipTitle(el.dataset.title);
      break;

    case 'cycle-theme': {
      const idx = (THEMES.indexOf(GLOBAL_SETTINGS.theme) + 1) % THEMES.length;
      GLOBAL_SETTINGS.theme = THEMES[idx];
      saveState();
      render();
      break;
    }

    case 'set-theme':
      GLOBAL_SETTINGS.theme = el.dataset.theme;
      saveState();
      render();
      break;

    case 'set-density':
      GLOBAL_SETTINGS.density = el.dataset.density;
      saveState();
      render();
      break;

    case 'set-lang':
      LANG = el.dataset.lang;
      GLOBAL_SETTINGS.lang = LANG;
      saveState();
      render();
      break;

    case 'toggle-lang':
      LANG = LANG === 'fr' ? 'en' : 'fr';
      GLOBAL_SETTINGS.lang = LANG;
      saveState();
      render();
      break;

    case 'set-avatar':
      S.profile.avatar = el.dataset.avatar;
      SFX.check();
      saveState();
      render();
      break;

    case 'toggle-sound':
      GLOBAL_SETTINGS.sound = !GLOBAL_SETTINGS.sound;
      saveState();
      if (GLOBAL_SETTINGS.sound) SFX.check();
      render();
      break;

    case 'switch-quest-tab':
      CURRENT_TAB = el.dataset.tab;
      render();
      break;

    case 'switch-shop-tab':
      CURRENT_TAB = el.dataset.tab;
      render();
      break;

    case 'switch-rewards-tab':
      CURRENT_TAB = el.dataset.tab;
      render();
      break;

    case 'open-add-task':
      openAddTaskModal();
      break;

    case 'edit-task':
      openEditTaskModal(el.dataset.taskId);
      break;

    case 'delete-task': {
      const id = el.dataset.taskId;
      const task = S.tasks.find(x => x.id === id);
      if (!task) break;
      openConfirmModal(
        LANG === 'fr' ? 'Supprimer cette tâche ?' : 'Delete this task?',
        LANG === 'fr' ? 'La tâche « ' + L(task.label) + ' » sera retirée.' : 'Task "' + L(task.label) + '" will be removed.',
        () => {
          S.tasks = S.tasks.filter(x => x.id !== id);
          saveState();
          render();
          closeModal();
        }
      );
      break;
    }

    case 'export-data':
      exportData();
      break;

    case 'import-data':
      const input = $('#import-file');
      if (input) input.click();
      break;

    case 'open-reset':
      openResetModal();
      break;

    case 'do-reset': {
      localStorage.removeItem(APP.storageKey);
      S = createInitialState();
      saveState();
      closeModal();
      render();
      toast('🧹 ' + t('resetAll'), '🧹', 1800);
      break;
    }

    case 'save-task':
      handleSaveTask();
      break;

    case 'save-edit-task':
      handleSaveEditTask(el.dataset.taskId);
      break;

    case 'welcome-close':
      S.seenWelcome = true;
      saveState();
      closeModal();
      break;

    case 'open-daily-login':
    case 'open-spin':
    case 'open-quests':
      CURRENT_VIEW = 'more';
      CURRENT_TAB = 'daily';
      render();
      window.scrollTo({ top: 0, behavior: 'smooth' });
      break;

    case 'open-week-claim':
      CURRENT_VIEW = 'week';
      render();
      window.scrollTo({ top: 0, behavior: 'smooth' });
      break;
  }
});

function defaultTabForView(view) {
  if (view === 'quests') return 'daily';
  if (view === 'shop') return 'all';
  if (view === 'rewards') return 'achievements';
  return 'daily';
}

/* ---------- Live input handling ---------- */
document.addEventListener('input', function (e) {
  const el = e.target.closest('[data-field]');
  if (!el) return;
  const f = el.dataset.field;

  if (f === 'name') {
    S.profile.name = el.value.slice(0, 20);
    $('#brand-title').textContent = S.profile.name || t('appName');
    saveState();
  } else if (f === 'wakeTarget') {
    S.settings.wakeTarget = el.value || '07:00';
    saveState();
  } else if (f === 'weekGoal') {
    S.settings.weekGoal = clamp(parseInt(el.value, 10) || 7, 1, 7);
    saveState();
  } else if (f === 'monthGoal') {
    S.settings.monthGoal = clamp(parseInt(el.value, 10) || 26, 1, 31);
    saveState();
  }
});

/* ---------- Import file ---------- */
document.addEventListener('change', function (e) {
  if (e.target.id !== 'import-file') return;
  const file = e.target.files && e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function (ev) {
    try {
      const data = JSON.parse(ev.target.result);
      S = migrateState(data);
      LANG = GLOBAL_SETTINGS.lang || S.lang || 'fr';
      saveState();
      render();
      toast('📥 ' + t('importData') + ' ✓', '✅', 1800, 'success');
    } catch (err) {
      toast('❌ ' + (LANG === 'fr' ? 'Fichier invalide' : 'Invalid file'), '❌', 2000, 'danger');
    }
  };
  reader.readAsText(file);
  e.target.value = '';
});

function openDayDetail(key) {
  const date = dateFromKey(key);
  const tasks = activeTasks();
  const done = dayDoneCount(key);
  const earned = dayEarnedPoints(key);
  const perfect = isPerfectDay(key);

  const rows = tasks.map(task => {
    const day = S.days[key] || { done: {} };
    const d = day.done[task.id];
    const isDone = !!d;
    const right = isDone
      ? '<span class="badge success">✓ +' + ((d.points || 0) + (d.bonus || 0) + (d.comboBonus || 0)) + '</span>'
      : '<span class="badge">—</span>';
    return (
      '<div class="row" style="padding:9px 0;border-bottom:1px solid var(--border)">' +
        '<span style="font-size:20px">' + escapeHtml(task.icon) + '</span>' +
        '<span class="grow small bold"' + (isDone ? ' style="opacity:.55;text-decoration:line-through"' : '') + '>' +
          escapeHtml(L(task.label)) +
        '</span>' +
        right +
      '</div>'
    );
  }).join('');

  const html =
    '<button class="modal-close" data-modal-close aria-label="Close">✕</button>' +
    '<div class="modal-icon">' + (perfect ? '⭐' : '📅') + '</div>' +
    '<div class="modal-title" style="text-transform:capitalize">' + escapeHtml(fmtLongDate(date)) + '</div>' +
    '<div class="modal-text">' +
      done + ' / ' + tasks.length + ' ' + escapeHtml(t('tasksOf')) +
      ' · ⭐ ' + earned + ' ' + escapeHtml(t('points')) +
    '</div>' +
    '<hr class="divider">' +
    '<div>' + rows + '</div>' +
    '<div class="modal-actions">' +
      '<button class="btn ghost" data-modal-close>' + escapeHtml(t('close')) + '</button>' +
    '</div>';

  openModal(html);
}

function openConfirmModal(title, text, onConfirm) {
  const html =
    '<button class="modal-close" data-modal-close aria-label="Close">✕</button>' +
    '<div class="modal-icon">⚠️</div>' +
    '<div class="modal-title">' + escapeHtml(title) + '</div>' +
    '<div class="modal-text">' + escapeHtml(text) + '</div>' +
    '<div class="modal-actions">' +
      '<button class="btn ghost" data-modal-close>' + escapeHtml(t('cancel')) + '</button>' +
      '<button class="btn danger" id="confirm-action-btn">' + escapeHtml(t('yes')) + '</button>' +
    '</div>';

    onOpen: box => {

      if (btn) {

      }

  });
}
