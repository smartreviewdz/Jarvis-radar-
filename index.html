<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#ff7eb3">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>⭐ Star Quest — Ma Semaine de Championne</title>
<style>
/* ============================================================================
   STAR QUEST — Habit Tracker for Kids
   ============================================================================
   SECTION 1: RESET & BASE
   ============================================================================ */
*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}
html {
  -webkit-text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent;
  scroll-behavior: smooth;
}
body {
  font-family: 'Nunito', 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif;
  font-size: 16px;
  line-height: 1.5;
  color: var(--text);
  background: var(--bg);
  min-height: 100vh;
  min-height: 100dvh;
  overflow-x: hidden;
  transition: background-color 0.3s ease, color 0.3s ease;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  overscroll-behavior-y: none;
}
button {
  font-family: inherit;
  font-size: inherit;
  cursor: pointer;
  border: none;
  background: none;
  color: inherit;
  -webkit-appearance: none;
  appearance: none;
}
input, select, textarea {
  font-family: inherit;
  font-size: inherit;
  color: inherit;
  -webkit-appearance: none;
  appearance: none;
}
h1, h2, h3, h4, h5, h6 { font-weight: 800; line-height: 1.2; }
a { color: var(--primary); text-decoration: none; }
ul, ol { list-style: none; }
img, svg { display: block; max-width: 100%; }
:focus-visible {
  outline: 3px solid var(--primary);
  outline-offset: 3px;
  border-radius: 8px;
}

/* ============================================================================
   SECTION 2: THEME VARIABLES
   ============================================================================ */
:root {
  --radius-xs: 6px;
  --radius-sm: 10px;
  --radius-md: 14px;
  --radius-lg: 20px;
  --radius-xl: 28px;
  --radius-pill: 999px;
  --shadow-sm: 0 2px 6px rgba(0, 0, 0, 0.06);
  --shadow-md: 0 6px 16px rgba(0, 0, 0, 0.08);
  --shadow-lg: 0 16px 40px rgba(0, 0, 0, 0.12);
  --shadow-xl: 0 24px 60px rgba(0, 0, 0, 0.18);
  --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
  --ease-in-out: cubic-bezier(0.65, 0, 0.35, 1);
  --spring: cubic-bezier(0.34, 1.56, 0.64, 1);
  --fast: 150ms;
  --normal: 250ms;
  --slow: 400ms;
}

/* THEME: CANDY */
.theme-candy {
  --bg: linear-gradient(160deg, #ffe5f0 0%, #f5e8ff 50%, #e8f0ff 100%);
  --bg-solid: #f5e8ff;
  --card: #ffffff;
  --card-2: #fdf8ff;
  --card-hover: #faf3ff;
  --text: #2d1f42;
  --text-soft: #6b5a85;
  --text-muted: #9a8cb0;
  --border: #f0e5f8;
  --border-strong: #e0cff0;
  --primary: #ff7eb3;
  --primary-dark: #e8508f;
  --primary-soft: rgba(255, 126, 179, 0.14);
  --secondary: #b48eff;
  --secondary-soft: rgba(180, 142, 255, 0.14);
  --accent: #ffc93c;
  --accent-soft: rgba(255, 201, 60, 0.18);
  --success: #4ade80;
  --success-soft: rgba(74, 222, 128, 0.16);
  --danger: #ff6b81;
  --danger-soft: rgba(255, 107, 129, 0.14);
  --info: #5eb8ff;
  --info-soft: rgba(94, 184, 255, 0.16);
  --text-on-primary: #ffffff;
  --gradient-primary: linear-gradient(135deg, #ff7eb3, #b48eff);
  --gradient-gold: linear-gradient(135deg, #ffd93c, #ff9a3c);
  --gradient-success: linear-gradient(135deg, #6ee7b7, #4ade80);
  --gradient-danger: linear-gradient(135deg, #ff8fa3, #ff6b81);
}

/* THEME: OCEAN */
.theme-ocean {
  --bg: linear-gradient(160deg, #dff4ff 0%, #e0f7f3 50%, #e6eeff 100%);
  --bg-solid: #e0f7f3;
  --card: #ffffff;
  --card-2: #f4fbff;
  --card-hover: #eaf7ff;
  --text: #0d3244;
  --text-soft: #37647c;
  --text-muted: #6b91a6;
  --border: #d8eef7;
  --border-strong: #b8e0f0;
  --primary: #17b0d6;
  --primary-dark: #0a8fb3;
  --primary-soft: rgba(23, 176, 214, 0.14);
  --secondary: #4a8dff;
  --secondary-soft: rgba(74, 141, 255, 0.14);
  --accent: #ffcb47;
  --accent-soft: rgba(255, 203, 71, 0.18);
  --success: #22c98f;
  --success-soft: rgba(34, 201, 143, 0.16);
  --danger: #ff7a8a;
  --danger-soft: rgba(255, 122, 138, 0.14);
  --info: #5eb8ff;
  --info-soft: rgba(94, 184, 255, 0.16);
  --text-on-primary: #ffffff;
  --gradient-primary: linear-gradient(135deg, #17b0d6, #4a8dff);
  --gradient-gold: linear-gradient(135deg, #ffd93c, #ff9a3c);
  --gradient-success: linear-gradient(135deg, #6ee7b7, #22c98f);
  --gradient-danger: linear-gradient(135deg, #ff8fa3, #ff7a8a);
}

/* THEME: FOREST */
.theme-forest {
  --bg: linear-gradient(160deg, #e8f8ea 0%, #f2fbe8 50%, #e5f4ef 100%);
  --bg-solid: #f2fbe8;
  --card: #ffffff;
  --card-2: #f6fdf5;
  --card-hover: #effbee;
  --text: #1a3622;
  --text-soft: #3d5e46;
  --text-muted: #6f8f77;
  --border: #e3f2e4;
  --border-strong: #c8e4ca;
  --primary: #3fae6a;
  --primary-dark: #2c8a4f;
  --primary-soft: rgba(63, 174, 106, 0.14);
  --secondary: #7fc95c;
  --secondary-soft: rgba(127, 201, 92, 0.14);
  --accent: #ffcb47;
  --accent-soft: rgba(255, 203, 71, 0.18);
  --success: #38c172;
  --success-soft: rgba(56, 193, 114, 0.16);
  --danger: #ef6b6b;
  --danger-soft: rgba(239, 107, 107, 0.14);
  --info: #5eb8ff;
  --info-soft: rgba(94, 184, 255, 0.16);
  --text-on-primary: #ffffff;
  --gradient-primary: linear-gradient(135deg, #3fae6a, #7fc95c);
  --gradient-gold: linear-gradient(135deg, #ffd93c, #ff9a3c);
  --gradient-success: linear-gradient(135deg, #6ee7b7, #38c172);
  --gradient-danger: linear-gradient(135deg, #ff8fa3, #ef6b6b);
}

/* THEME: NIGHT */
.theme-night {
  --bg: linear-gradient(160deg, #1a1730 0%, #221c3d 50%, #2a1f3a 100%);
  --bg-solid: #1a1730;
  --card: #2a2545;
  --card-2: #332c52;
  --card-hover: #3a3259;
  --text: #f2ecff;
  --text-soft: #c4b8e0;
  --text-muted: #9287b0;
  --border: #3d3459;
  --border-strong: #524670;
  --primary: #ff86c0;
  --primary-dark: #e05ba1;
  --primary-soft: rgba(255, 134, 192, 0.18);
  --secondary: #a98bff;
  --secondary-soft: rgba(169, 139, 255, 0.18);
  --accent: #ffd166;
  --accent-soft: rgba(255, 209, 102, 0.2);
  --success: #4ade80;
  --success-soft: rgba(74, 222, 128, 0.18);
  --danger: #ff8095;
  --danger-soft: rgba(255, 128, 149, 0.18);
  --info: #7bc4ff;
  --info-soft: rgba(123, 196, 255, 0.18);
  --text-on-primary: #221c3d;
  --shadow-sm: 0 2px 6px rgba(0, 0, 0, 0.4);
  --shadow-md: 0 6px 16px rgba(0, 0, 0, 0.4);
  --shadow-lg: 0 16px 40px rgba(0, 0, 0, 0.5);
  --gradient-primary: linear-gradient(135deg, #ff86c0, #a98bff);
  --gradient-gold: linear-gradient(135deg, #ffd93c, #ff9a3c);
  --gradient-success: linear-gradient(135deg, #6ee7b7, #4ade80);
  --gradient-danger: linear-gradient(135deg, #ff8fa3, #ff8095);
}

/* THEME: SUNSET */
.theme-sunset {
  --bg: linear-gradient(160deg, #fff0e6 0%, #ffe6ee 50%, #ffe9d6 100%);
  --bg-solid: #fff0e6;
  --card: #ffffff;
  --card-2: #fff8f4;
  --card-hover: #fff3ec;
  --text: #4a2210;
  --text-soft: #8a4a2c;
  --text-muted: #b07050;
  --border: #ffe4d3;
  --border-strong: #ffc9a8;
  --primary: #ff7043;
  --primary-dark: #e04a1f;
  --primary-soft: rgba(255, 112, 67, 0.14);
  --secondary: #ec407a;
  --secondary-soft: rgba(236, 64, 122, 0.14);
  --accent: #ffb347;
  --accent-soft: rgba(255, 179, 71, 0.18);
  --success: #66bb6a;
  --success-soft: rgba(102, 187, 106, 0.16);
  --danger: #ef5350;
  --danger-soft: rgba(239, 83, 80, 0.14);
  --info: #42a5f5;
  --info-soft: rgba(66, 165, 245, 0.16);
  --text-on-primary: #ffffff;
  --gradient-primary: linear-gradient(135deg, #ff7043, #ec407a);
  --gradient-gold: linear-gradient(135deg, #ffb347, #ff8a3c);
  --gradient-success: linear-gradient(135deg, #a5d6a7, #66bb6a);
  --gradient-danger: linear-gradient(135deg, #ff8a80, #ef5350);
}

/* ============================================================================
   SECTION 3: LAYOUT
   ============================================================================ */
.app {
  max-width: 600px;
  margin: 0 auto;
  padding: 0 14px calc(120px + env(safe-area-inset-bottom));
  min-height: 100vh;
  position: relative;
  z-index: 2;
}

.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 4px 10px;
  gap: 10px;
}

.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  font-weight: 900;
  font-size: 17px;
  letter-spacing: -0.3px;
}

.brand-icon {
  width: 38px;
  height: 38px;
  border-radius: 12px;
  background: var(--gradient-primary);
  display: grid;
  place-items: center;
  font-size: 20px;
  box-shadow: var(--shadow-md);
  color: #fff;
  flex-shrink: 0;
}

.brand-text {
  display: flex;
  flex-direction: column;
  line-height: 1.1;
}

.brand-text .title {
  font-size: 15px;
  font-weight: 900;
}

.brand-text .subtitle {
  font-size: 10.5px;
  color: var(--text-muted);
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

.top-actions {
  display: flex;
  gap: 8px;
  flex-shrink: 0;
}

.icon-btn {
  width: 42px;
  height: 42px;
  border-radius: 14px;
  background: var(--card);
  display: grid;
  place-items: center;
  font-size: 18px;
  box-shadow: var(--shadow-sm);
  transition: transform var(--fast) var(--ease-out), background var(--normal);
  border: 1px solid var(--border);
  color: var(--text);
}

.icon-btn:hover {
  background: var(--card-hover);
}

.icon-btn:active {
  transform: scale(0.9);
}

/* ============================================================================
   SECTION 4: CARDS
   ============================================================================ */
.card {
  background: var(--card);
  border-radius: var(--radius-lg);
  padding: 18px;
  margin-bottom: 14px;
  box-shadow: var(--shadow-md);
  border: 1px solid var(--border);
  transition: background var(--normal);
  position: relative;
  overflow: hidden;
}

.card.compact {
  padding: 14px;
}

.card.flat {
  box-shadow: none;
  border: 1.5px solid var(--border);
}

.card-title {
  display: flex;
  align-items: center;
  gap: 9px;
  font-size: 15px;
  font-weight: 900;
  margin-bottom: 14px;
  letter-spacing: -0.2px;
  color: var(--text);
}

.card-title .emoji {
  font-size: 19px;
  line-height: 1;
}

.card-title .spacer {
  flex: 1;
}

.card-title .badge-pill {
  font-size: 11px;
  font-weight: 800;
  padding: 4px 10px;
  border-radius: var(--radius-pill);
  background: var(--primary-soft);
  color: var(--primary);
}

/* ============================================================================
   SECTION 5: HERO
   ============================================================================ */
.hero {
  position: relative;
  background: var(--gradient-primary);
  border-radius: var(--radius-xl);
  padding: 22px;
  color: #fff;
  box-shadow: 0 20px 44px rgba(150, 80, 200, 0.28);
  margin-bottom: 14px;
  overflow: hidden;
  isolation: isolate;
}

.hero::before {
  content: '';
  position: absolute;
  inset: -50% -20% auto auto;
  width: 260px;
  height: 260px;
  background: radial-gradient(circle, rgba(255, 255, 255, 0.28), transparent 65%);
  pointer-events: none;
  z-index: -1;
}

.hero::after {
  content: '';
  position: absolute;
  inset: auto auto -50% -20%;
  width: 240px;
  height: 240px;
  background: radial-gradient(circle, rgba(255, 255, 255, 0.18), transparent 65%);
  pointer-events: none;
  z-index: -1;
}

.hero-top {
  display: flex;
  align-items: center;
  gap: 13px;
  position: relative;
  z-index: 1;
}

.hero-avatar {
  width: 60px;
  height: 60px;
  border-radius: 20px;
  background: rgba(255, 255, 255, 0.22);
  display: grid;
  place-items: center;
  font-size: 32px;
  flex-shrink: 0;
  box-shadow: inset 0 0 0 2px rgba(255, 255, 255, 0.35);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
}

.hero-greeting {
  display: flex;
  flex-direction: column;
  gap: 3px;
  min-width: 0;
  flex: 1;
}

.hero-greeting .hi {
  font-size: 19px;
  font-weight: 900;
  letter-spacing: -0.4px;
  line-height: 1.15;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.hero-greeting .date {
  font-size: 12.5px;
  font-weight: 700;
  opacity: 0.88;
  text-transform: capitalize;
}

.hero-points {
  background: rgba(255, 255, 255, 0.24);
  border-radius: var(--radius-pill);
  padding: 9px 14px;
  display: flex;
  align-items: center;
  gap: 6px;
  font-weight: 900;
  font-size: 14.5px;
  flex-shrink: 0;
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  white-space: nowrap;
}

.hero-body {
  display: flex;
  align-items: center;
  gap: 18px;
  margin-top: 20px;
  position: relative;
  z-index: 1;
}

.hero-ring {
  position: relative;
  width: 120px;
  height: 120px;
  flex-shrink: 0;
}

.hero-ring svg {
  width: 120px;
  height: 120px;
  transform: rotate(-90deg);
}

.hero-ring .ring-bg {
  fill: none;
  stroke: rgba(255, 255, 255, 0.26);
  stroke-width: 11;
}

.hero-ring .ring-fg {
  fill: none;
  stroke: #ffffff;
  stroke-width: 11;
  stroke-linecap: round;
  transition: stroke-dashoffset 800ms var(--ease-out);
  filter: drop-shadow(0 0 7px rgba(255, 255, 255, 0.55));
}

.hero-ring-label {
  position: absolute;
  inset: 0;
  display: grid;
  place-content: center;
  text-align: center;
  line-height: 1;
  pointer-events: none;
}

.hero-ring-label .num {
  font-size: 32px;
  font-weight: 900;
  letter-spacing: -1.5px;
}

.hero-ring-label .divider {
  font-size: 15px;
  font-weight: 700;
  opacity: 0.75;
}

.hero-stats {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 9px;
  min-width: 0;
}

.hero-stat {
  display: flex;
  align-items: center;
  gap: 8px;
  background: rgba(255, 255, 255, 0.18);
  border-radius: 14px;
  padding: 10px 13px;
  font-size: 13px;
  font-weight: 700;
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
  overflow: hidden;
}

.hero-stat .val {
  font-size: 16px;
  font-weight: 900;
  margin-left: auto;
  flex-shrink: 0;
}

/* ============================================================================
   SECTION 6: PROGRESS BARS
   ============================================================================ */
.progress-bar {
  height: 12px;
  background: var(--border);
  border-radius: var(--radius-pill);
  overflow: hidden;
  position: relative;
  box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.06);
}

.progress-bar .fill {
  height: 100%;
  border-radius: var(--radius-pill);
  background: var(--gradient-primary);
  transition: width 700ms var(--ease-out);
  position: relative;
  box-shadow: 0 0 12px rgba(255, 126, 179, 0.5);
}

.progress-bar.gold .fill {
  background: var(--gradient-gold);
  box-shadow: 0 0 12px rgba(255, 201, 60, 0.6);
}

.progress-bar.green .fill {
  background: var(--gradient-success);
  box-shadow: 0 0 12px rgba(74, 222, 128, 0.5);
}

.progress-bar.danger .fill {
  background: var(--gradient-danger);
}

.progress-bar .fill::after {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(180deg, rgba(255, 255, 255, 0.35), transparent);
  border-radius: inherit;
  pointer-events: none;
}

.progress-label {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  font-size: 12.5px;
  font-weight: 800;
  color: var(--text-soft);
  margin-bottom: 7px;
}

.progress-label .val {
  color: var(--text);
  font-variant-numeric: tabular-nums;
}

/* ============================================================================
   SECTION 7: TASK LIST
   ============================================================================ */
.task-list {
  display: flex;
  flex-direction: column;
  gap: 9px;
}

.task {
  display: flex;
  align-items: center;
  gap: 13px;
  padding: 13px 14px;
  border-radius: var(--radius-md);
  background: var(--card-2);
  border: 1.5px solid var(--border);
  text-align: left;
  width: 100%;
  transition: transform var(--fast) var(--ease-out),
              background var(--normal),
              border-color var(--normal),
              box-shadow var(--normal);
  position: relative;
  overflow: hidden;
  -webkit-user-select: none;
  user-select: none;
}

.task:hover {
  background: var(--card-hover);
}

.task:active {
  transform: scale(0.98);
}

.task-icon {
  width: 44px;
  height: 44px;
  border-radius: 13px;
  background: var(--card);
  display: grid;
  place-items: center;
  font-size: 22px;
  flex-shrink: 0;
  box-shadow: var(--shadow-sm);
  border: 1px solid var(--border);
}

.task-body {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.task-label {
  font-weight: 800;
  font-size: 14.5px;
  line-height: 1.25;
  letter-spacing: -0.1px;
}

.task-meta {
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
  align-items: center;
}

.task-right {
  flex-shrink: 0;
  display: flex;
  align-items: center;
  gap: 8px;
}

.task-check {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  border: 2.5px solid var(--border-strong);
  background: var(--card);
  display: grid;
  place-items: center;
  font-size: 15px;
  color: transparent;
  transition: all var(--normal) var(--spring);
  flex-shrink: 0;
}

.task.done {
  background: var(--success-soft);
  border-color: rgba(74, 222, 128, 0.5);
}

.task.done .task-label {
  text-decoration: line-through;
  text-decoration-thickness: 2px;
  opacity: 0.6;
}

.task.done .task-check {
  background: var(--success);
  border-color: var(--success);
  color: #fff;
  transform: scale(1.05);
}

.task.timer-running {
  border-color: var(--accent);
  background: var(--accent-soft);
  animation: timerPulse 1.8s infinite;
}

@keyframes timerPulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(255, 201, 60, 0.6); }
  50%      { box-shadow: 0 0 0 10px rgba(255, 201, 60, 0); }
}

.task-timer {
  font-variant-numeric: tabular-nums;
  font-weight: 900;
  font-size: 15px;
  padding: 5px 11px;
  border-radius: var(--radius-sm);
  background: var(--card);
  color: var(--text);
  box-shadow: var(--shadow-sm);
  min-width: 58px;
  text-align: center;
}

.task.timer-over .task-timer {
  color: var(--danger);
}

/* BADGES */
.badge {
  display: inline-flex;
  align-items: center;
  gap: 3px;
  font-size: 10.5px;
  font-weight: 800;
  padding: 3px 8px;
  border-radius: var(--radius-pill);
  background: var(--border);
  color: var(--text-soft);
  white-space: nowrap;
  line-height: 1.2;
}

.badge.points {
  background: var(--secondary-soft);
  color: var(--secondary);
}

.badge.bonus {
  background: var(--accent-soft);
  color: #b57300;
}

.badge.success {
  background: var(--success-soft);
  color: #1a8a4a;
}

.badge.danger {
  background: var(--danger-soft);
  color: var(--danger);
}

.badge.info {
  background: var(--info-soft);
  color: #2a7fc4;
}

/* ============================================================================
   SECTION 8: WEEK GRID
   ============================================================================ */
.week-grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 7px;
}

.day-cell {
  background: var(--card-2);
  border: 1.5px solid var(--border);
  border-radius: var(--radius-md);
  padding: 10px 3px 9px;
  text-align: center;
  transition: transform var(--fast) var(--ease-out),
              background var(--normal),
              border-color var(--normal);
  position: relative;
  cursor: pointer;
}

.day-cell:hover {
  background: var(--card-hover);
}

.day-cell:active {
  transform: scale(0.94);
}

.day-cell .dname {
  font-size: 10px;
  font-weight: 900;
  text-transform: uppercase;
  letter-spacing: 0.4px;
  color: var(--text-muted);
}

.day-cell .dnum {
  font-size: 16px;
  font-weight: 900;
  margin: 3px 0 5px;
  line-height: 1;
  font-variant-numeric: tabular-nums;
}

.day-cell .dmark {
  font-size: 16px;
  line-height: 1;
  height: 18px;
}

.day-cell.perfect {
  background: var(--accent-soft);
  border-color: rgba(255, 201, 60, 0.55);
}

.day-cell.partial {
  background: var(--secondary-soft);
  border-color: rgba(180, 142, 255, 0.45);
}

.day-cell.today {
  box-shadow: 0 0 0 2.5px var(--primary);
}

.day-cell.future {
  opacity: 0.45;
}

.day-cell .ddot {
  position: absolute;
  top: 5px;
  right: 6px;
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--secondary);
}

/* ============================================================================
   SECTION 9: MONTH CALENDAR
   ============================================================================ */
.calendar {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 5px;
}

.cal-wd {
  text-align: center;
  font-size: 10.5px;
  font-weight: 900;
  text-transform: uppercase;
  color: var(--text-muted);
  padding: 4px 0 8px;
  letter-spacing: 0.4px;
}

.cal-cell {
  aspect-ratio: 1 / 1;
  border-radius: 11px;
  display: grid;
  place-items: center;
  font-size: 13px;
  font-weight: 800;
  background: var(--card-2);
  border: 1.5px solid var(--border);
  transition: transform var(--fast) var(--ease-out), background var(--normal);
  cursor: pointer;
  font-variant-numeric: tabular-nums;
  color: var(--text);
}

.cal-cell:hover {
  background: var(--card-hover);
}

.cal-cell:active {
  transform: scale(0.9);
}

.cal-cell.empty {
  background: transparent;
  border-color: transparent;
  cursor: default;
  pointer-events: none;
}

.cal-cell.perfect {
  background: var(--gradient-gold);
  border-color: #ffb020;
  color: #6b4200;
  font-weight: 900;
}

.cal-cell.partial {
  background: var(--secondary-soft);
  border-color: rgba(180, 142, 255, 0.45);
}

.cal-cell.today {
  box-shadow: 0 0 0 2.5px var(--primary);
}

.cal-cell.future {
  opacity: 0.42;
}

/* ============================================================================
   SECTION 10: REWARD CARDS
   ============================================================================ */
.reward {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 15px;
  border-radius: var(--radius-lg);
  background: var(--card-2);
  border: 1.5px solid var(--border);
  margin-bottom: 11px;
  transition: transform var(--fast) var(--ease-out),
              background var(--normal),
              border-color var(--normal);
}

.reward:last-child {
  margin-bottom: 0;
}

.reward:hover {
  background: var(--card-hover);
}

.reward.unlocked {
  background: linear-gradient(120deg, var(--accent-soft), var(--primary-soft));
  border-color: rgba(255, 201, 60, 0.55);
  animation: glowGold 2.8s ease-in-out infinite;
}

@keyframes glowGold {
  0%, 100% { box-shadow: 0 0 0 0 rgba(255, 201, 60, 0.35); }
  50%      { box-shadow: 0 0 0 12px rgba(255, 201, 60, 0); }
}

.reward.claimed {
  background: var(--success-soft);
  border-color: rgba(74, 222, 128, 0.5);
  animation: none;
}

.reward-icon {
  width: 54px;
  height: 54px;
  border-radius: 17px;
  background: var(--card);
  display: grid;
  place-items: center;
  font-size: 28px;
  flex-shrink: 0;
  box-shadow: var(--shadow-sm);
  border: 1px solid var(--border);
}

.reward.locked .reward-icon {
  filter: grayscale(0.6);
  opacity: 0.72;
}

.reward-body {
  flex: 1;
  min-width: 0;
}

.reward-name {
  font-weight: 900;
  font-size: 15px;
  letter-spacing: -0.2px;
}

.reward-desc {
  font-size: 12.5px;
  color: var(--text-muted);
  font-weight: 700;
  margin-top: 4px;
  line-height: 1.4;
}

/* ============================================================================
   SECTION 11: BUTTONS
   ============================================================================ */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 13px 22px;
  border-radius: var(--radius-md);
  font-weight: 900;
  font-size: 14.5px;
  background: var(--card);
  color: var(--text);
  border: 1.5px solid var(--border-strong);
  transition: transform var(--fast) var(--ease-out),
              background var(--normal),
              box-shadow var(--normal),
              opacity var(--normal);
  white-space: nowrap;
  -webkit-user-select: none;
  user-select: none;
  letter-spacing: -0.1px;
}

.btn:hover:not(:disabled) {
  background: var(--card-hover);
}

.btn:active:not(:disabled) {
  transform: scale(0.96);
}

.btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

.btn.primary {
  background: var(--gradient-primary);
  color: var(--text-on-primary);
  border-color: transparent;
  box-shadow: 0 10px 24px rgba(150, 80, 200, 0.3);
}

.btn.primary:hover:not(:disabled) {
  filter: brightness(1.05);
}

.btn.gold {
  background: var(--gradient-gold);
  color: #6b4200;
  border-color: transparent;
  box-shadow: 0 10px 24px rgba(255, 170, 40, 0.36);
}

.btn.success {
  background: var(--gradient-success);
  color: #fff;
  border-color: transparent;
  box-shadow: 0 10px 24px rgba(74, 222, 128, 0.3);
}

.btn.danger {
  background: var(--danger-soft);
  color: var(--danger);
  border-color: rgba(255, 107, 129, 0.35);
}

.btn.ghost {
  background: transparent;
  border-color: var(--border-strong);
}

.btn.block {
  width: 100%;
}

.btn.sm {
  padding: 9px 15px;
  font-size: 13px;
  border-radius: var(--radius-sm);
}

.btn.xs {
  padding: 6px 11px;
  font-size: 12px;
  border-radius: var(--radius-sm);
  gap: 4px;
}

.btn.icon-only {
  padding: 9px;
  width: 38px;
  height: 38px;
}

/* ============================================================================
   SECTION 12: ACHIEVEMENTS
   ============================================================================ */
.ach-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(96px, 1fr));
  gap: 10px;
}

.ach {
  background: var(--card-2);
  border: 1.5px solid var(--border);
  border-radius: var(--radius-md);
  padding: 14px 8px 12px;
  text-align: center;
  transition: transform var(--normal) var(--spring),
              filter var(--normal);
  cursor: pointer;
}

.ach:hover {
  transform: translateY(-2px);
}

.ach.locked {
  filter: grayscale(1);
  opacity: 0.42;
}

.ach.unlocked {
  border-color: rgba(255, 201, 60, 0.55);
  background: linear-gradient(160deg, var(--accent-soft), transparent);
}

.ach-icon {
  font-size: 30px;
  line-height: 1;
  margin-bottom: 7px;
}

.ach-name {
  font-size: 11.5px;
  font-weight: 900;
  line-height: 1.25;
  letter-spacing: -0.1px;
}

.ach-desc {
  font-size: 10px;
  color: var(--text-muted);
  margin-top: 4px;
  line-height: 1.3;
  font-weight: 700;
}

/* ============================================================================
   SECTION 13: TAB BAR
   ============================================================================ */
.tabbar {
  position: fixed;
  left: 50%;
  bottom: 14px;
  transform: translateX(-50%);
  width: min(576px, calc(100% - 24px));
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 24px;
  box-shadow: var(--shadow-xl);
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  padding: 8px;
  z-index: 40;
  padding-bottom: calc(8px + env(safe-area-inset-bottom));
}

.tab {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 3px;
  padding: 8px 4px 6px;
  border-radius: 17px;
  font-size: 10px;
  font-weight: 900;
  color: var(--text-muted);
  transition: background var(--normal),
              color var(--normal),
              transform var(--fast) var(--ease-out);
  position: relative;
  letter-spacing: 0.2px;
}

.tab:hover {
  color: var(--text);
}

.tab:active {
  transform: scale(0.92);
}

.tab.active {
  color: var(--primary);
  background: var(--primary-soft);
}

.tab-icon {
  font-size: 21px;
  line-height: 1;
  transition: transform var(--normal) var(--spring);
}

.tab.active .tab-icon {
  transform: translateY(-1px) scale(1.15);
}

.tab-dot {
  position: absolute;
  top: 6px;
  right: 50%;
  margin-right: -18px;
  width: 9px;
  height: 9px;
  border-radius: 50%;
  background: var(--danger);
  box-shadow: 0 0 0 2px var(--card);
  animation: dotPulse 1.5s infinite;
}

@keyframes dotPulse {
  0%, 100% { transform: scale(1); }
  50%      { transform: scale(1.2); }
}

/* ============================================================================
   SECTION 14: MODAL
   ============================================================================ */
.modal-overlay {
  position: fixed;
  inset: 0;
  z-index: 100;
  display: grid;
  place-items: center;
  padding: 20px;
  background: rgba(20, 10, 40, 0.55);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  opacity: 0;
  pointer-events: none;
  transition: opacity var(--normal) ease;
}

.modal-overlay.show {
  opacity: 1;
  pointer-events: auto;
}

.modal-box {
  background: var(--card);
  border-radius: var(--radius-xl);
  padding: 26px 22px 22px;
  width: 100%;
  max-width: 420px;
  max-height: 88vh;
  overflow-y: auto;
  box-shadow: var(--shadow-xl);
  transform: scale(0.86) translateY(14px);
  transition: transform 380ms var(--spring);
  position: relative;
}

.modal-overlay.show .modal-box {
  transform: scale(1) translateY(0);
}

.modal-icon {
  font-size: 64px;
  line-height: 1;
  text-align: center;
  margin-bottom: 10px;
  animation: popIn 600ms var(--spring);
}

@keyframes popIn {
  0%   { transform: scale(0.3) rotate(-15deg); opacity: 0; }
  65%  { transform: scale(1.15) rotate(5deg); }
  100% { transform: scale(1) rotate(0); opacity: 1; }
}

.modal-title {
  font-size: 22px;
  font-weight: 900;
  text-align: center;
  margin-bottom: 10px;
  letter-spacing: -0.5px;
}

.modal-text {
  color: var(--text-soft);
  font-size: 14.5px;
  font-weight: 700;
  text-align: center;
  line-height: 1.55;
  margin-bottom: 20px;
}

.modal-actions {
  display: flex;
  gap: 9px;
  margin-top: 18px;
}

.modal-actions .btn {
  flex: 1;
}

.modal-close {
  position: absolute;
  top: 14px;
  right: 14px;
  width: 34px;
  height: 34px;
  border-radius: 50%;
  background: var(--border);
  color: var(--text-soft);
  display: grid;
  place-items: center;
  font-size: 16px;
  transition: transform var(--fast);
}

.modal-close:active {
  transform: scale(0.9);
}

/* ============================================================================
   SECTION 15: TOASTS
   ============================================================================ */
.toast-stack {
  position: fixed;
  top: 16px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 200;
  display: flex;
  flex-direction: column;
  gap: 8px;
  align-items: center;
  pointer-events: none;
  width: min(420px, calc(100% - 28px));
}

.toast {
  background: var(--card);
  color: var(--text);
  padding: 12px 18px;
  border-radius: var(--radius-pill);
  box-shadow: var(--shadow-lg);
  font-weight: 900;
  font-size: 13.5px;
  display: flex;
  align-items: center;
  gap: 9px;
  border: 1.5px solid var(--border);
  animation: toastIn 400ms var(--spring);
  max-width: 100%;
  letter-spacing: -0.1px;
}

.toast.leaving {
  animation: toastOut 320ms ease forwards;
}

@keyframes toastIn {
  from { transform: translateY(-28px) scale(0.9); opacity: 0; }
  to   { transform: translateY(0) scale(1); opacity: 1; }
}

@keyframes toastOut {
  to { transform: translateY(-20px) scale(0.94); opacity: 0; }
}

/* ============================================================================
   SECTION 16: FORMS
   ============================================================================ */
.field {
  margin-bottom: 14px;
}

.field:last-child {
  margin-bottom: 0;
}

.field-label {
  display: block;
  font-size: 11.5px;
  font-weight: 900;
  color: var(--text-muted);
  margin-bottom: 7px;
  text-transform: uppercase;
  letter-spacing: 0.6px;
}

.input,
.select {
  width: 100%;
  padding: 12px 14px;
  border-radius: var(--radius-md);
  border: 1.5px solid var(--border-strong);
  background: var(--card-2);
  font-size: 14.5px;
  font-weight: 700;
  color: var(--text);
  transition: border-color var(--normal), box-shadow var(--normal);
}

.input:focus,
.select:focus {
  outline: none;
  border-color: var(--primary);
  box-shadow: 0 0 0 4px var(--primary-soft);
}

.input::placeholder {
  color: var(--text-muted);
  opacity: 0.7;
}

.select {
  cursor: pointer;
  background-image: url("data:image/svg+xml;charset=UTF-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%239a8cb0' stroke-width='3' stroke-linecap='round'%3E%3Cpath d='M6 9l6 6 6-6'/%3E%3C/svg%3E");
  background-repeat: no-repeat;
  background-position: right 12px center;
  background-size: 16px;
  padding-right: 40px;
}

.switch-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 13px 0;
  border-bottom: 1px solid var(--border);
}

.switch-row:last-child {
  border-bottom: none;
}

.switch-row .info {
  flex: 1;
  min-width: 0;
}

.switch-row .info .label {
  font-weight: 800;
  font-size: 14.5px;
}

.switch-row .info .sub {
  font-size: 12px;
  color: var(--text-muted);
  margin-top: 3px;
  font-weight: 700;
}

.switch {
  width: 52px;
  height: 30px;
  border-radius: var(--radius-pill);
  background: var(--border-strong);
  position: relative;
  transition: background var(--normal);
  flex-shrink: 0;
}

.switch::after {
  content: '';
  position: absolute;
  top: 3px;
  left: 3px;
  width: 24px;
  height: 24px;
  border-radius: 50%;
  background: #ffffff;
  box-shadow: 0 2px 6px rgba(0, 0, 0, 0.22);
  transition: transform 320ms var(--spring);
}

.switch.on {
  background: var(--success);
}

.switch.on::after {
  transform: translateX(22px);
}

.pill-row {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}

.pill {
  padding: 8px 14px;
  border-radius: var(--radius-pill);
  background: var(--card-2);
  border: 1.5px solid var(--border-strong);
  font-size: 13px;
  font-weight: 800;
  transition: background var(--normal), border-color var(--normal), color var(--normal);
  cursor: pointer;
}

.pill:hover {
  background: var(--card-hover);
}

.pill.on {
  background: var(--primary-soft);
  border-color: var(--primary);
  color: var(--primary);
}

.avatar-grid {
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  gap: 8px;
}

.avatar-option {
  aspect-ratio: 1 / 1;
  border-radius: 14px;
  background: var(--card-2);
  border: 2px solid var(--border);
  display: grid;
  place-items: center;
  font-size: 24px;
  transition: transform var(--fast) var(--ease-out),
              border-color var(--normal),
              background var(--normal);
  cursor: pointer;
}

.avatar-option:hover {
  background: var(--card-hover);
}

.avatar-option:active {
  transform: scale(0.9);
}

.avatar-option.selected {
  border-color: var(--primary);
  background: var(--primary-soft);
  transform: scale(1.05);
}

/* ============================================================================
   SECTION 17: LEVEL DISPLAY
   ============================================================================ */
.level-box {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 16px;
  border-radius: var(--radius-lg);
  background: linear-gradient(120deg, var(--secondary-soft), var(--primary-soft));
  border: 1.5px solid var(--border-strong);
  margin-bottom: 14px;
}

.level-badge {
  width: 56px;
  height: 56px;
  border-radius: 18px;
  background: var(--gradient-primary);
  color: #fff;
  display: grid;
  place-items: center;
  font-weight: 900;
  font-size: 22px;
  box-shadow: var(--shadow-md);
  flex-shrink: 0;
  letter-spacing: -1px;
}

.level-info {
  flex: 1;
  min-width: 0;
}

.level-info .title {
  font-weight: 900;
  font-size: 15.5px;
  margin-bottom: 5px;
  letter-spacing: -0.2px;
}

.level-info .sub {
  font-size: 12px;
  color: var(--text-soft);
  font-weight: 700;
  margin-bottom: 8px;
}

/* ============================================================================
   SECTION 18: STATS PAGE
   ============================================================================ */
.stats-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
}

.stat-card {
  padding: 16px;
  border-radius: var(--radius-md);
  background: var(--card-2);
  border: 1.5px solid var(--border);
  text-align: center;
}

.stat-card .stat-icon {
  font-size: 26px;
  margin-bottom: 6px;
  line-height: 1;
}

.stat-card .stat-value {
  font-size: 26px;
  font-weight: 900;
  letter-spacing: -1px;
  line-height: 1;
  color: var(--text);
  font-variant-numeric: tabular-nums;
}

.stat-card .stat-label {
  font-size: 11px;
  color: var(--text-muted);
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 0.4px;
  margin-top: 6px;
}

/* HEATMAP */
.heatmap {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 4px;
  margin-top: 10px;
}

.heatmap-cell {
  aspect-ratio: 1 / 1;
  border-radius: 6px;
  background: var(--border);
  position: relative;
}

.heatmap-cell.level-1 { background: rgba(74, 222, 128, 0.35); }
.heatmap-cell.level-2 { background: rgba(74, 222, 128, 0.6); }
.heatmap-cell.level-3 { background: rgba(74, 222, 128, 0.85); }
.heatmap-cell.level-4 { background: var(--success); }
.heatmap-cell.empty { background: transparent; }
.heatmap-cell.future { opacity: 0.3; }

/* ============================================================================
   SECTION 19: MISC
   ============================================================================ */
.divider {
  height: 1px;
  background: var(--border);
  margin: 15px 0;
  border: none;
}

.divider.spaced {
  margin: 20px 0;
}

.empty-state {
  text-align: center;
  padding: 36px 20px;
}

.empty-state .icon {
  font-size: 52px;
  margin-bottom: 12px;
  opacity: 0.85;
  line-height: 1;
}

.empty-state .title {
  font-weight: 900;
  font-size: 15px;
  margin-bottom: 6px;
}

.empty-state .text {
  color: var(--text-muted);
  font-size: 13px;
  font-weight: 700;
  line-height: 1.5;
}

.hidden {
  display: none !important;
}

.muted {
  color: var(--text-muted);
}

.soft {
  color: var(--text-soft);
}

.center {
  text-align: center;
}

.small {
  font-size: 13px;
}

.tiny {
  font-size: 11px;
}

.bold {
  font-weight: 900;
}

.row {
  display: flex;
  align-items: center;
  gap: 10px;
}

.row.wrap {
  flex-wrap: wrap;
}

.row.between {
  justify-content: space-between;
}

.row.center {
  justify-content: center;
}

.grow {
  flex: 1;
  min-width: 0;
}

.gap-sm { gap: 6px; }
.gap-md { gap: 12px; }
.gap-lg { gap: 18px; }

.mt-sm { margin-top: 8px; }
.mt-md { margin-top: 14px; }
.mt-lg { margin-top: 22px; }
.mb-sm { margin-bottom: 8px; }
.mb-md { margin-bottom: 14px; }

.tabular {
  font-variant-numeric: tabular-nums;
}

/* ============================================================================
   SECTION 20: ANIMATIONS
   ============================================================================ */
@keyframes fadeInUp {
  from { opacity: 0; transform: translateY(10px); }
  to   { opacity: 1; transform: translateY(0); }
}

.fade-in {
  animation: fadeInUp 400ms var(--ease-out);
}

.stagger > * {
  animation: fadeInUp 450ms var(--ease-out) backwards;
}

.stagger > *:nth-child(1)  { animation-delay: 0.02s; }
.stagger > *:nth-child(2)  { animation-delay: 0.05s; }
.stagger > *:nth-child(3)  { animation-delay: 0.08s; }

/* ============================================================================
   SECTION C: UTILITIES
   ============================================================================ */

const $  = (sel, root) => (root || document).querySelector(sel);
const $$ = (sel, root) => Array.prototype.slice.call((root || document).querySelectorAll(sel));

function pad2(n) { return String(n).padStart(2, '0'); }

function isoOf(date) {
  return date.getFullYear() + '-' + pad2(date.getMonth() + 1) + '-' + pad2(date.getDate());
}
function dateFromKey(key) {
  const parts = key.split('-').map(Number);
  return new Date(parts[0], parts[1] - 1, parts[2]);
}
function todayKey() { return isoOf(new Date()); }
function startOfDay(d) {
  const x = new Date(d.getTime());
  x.setHours(0, 0, 0, 0);
  return x;
}
function addDays(d, n) {
  const x = new Date(d.getTime());
  x.setDate(x.getDate() + n);
  x.setHours(0, 0, 0, 0);
  return x;
}
function weekStartOf(d) {
  const x = startOfDay(d);
  const dow = (x.getDay() + 6) % 7; // Monday = 0
  x.setDate(x.getDate() - dow);
  return x;
}
function weekKeyOf(d) { return isoOf(weekStartOf(d)); }
function monthKeyOf(d) { return d.getFullYear() + '-' + pad2(d.getMonth() + 1); }

function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
function uid() { return Math.random().toString(36).slice(2, 10); }

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    '&': '&amp;',
    '<': '&lt;',
    '>': '&gt;',
    '"': '&quot;',
    "'": '&#39;',
  }[c]));
}

function fmtDuration(totalSeconds) {
  const s = Math.max(0, Math.round(totalSeconds));
  const m = Math.floor(s / 60);
  const r = s % 60;
  return m + ':' + pad2(r);
}

function fmtDurationLong(totalSeconds) {
  const s = Math.max(0, Math.round(totalSeconds));
  const m = Math.floor(s / 60);
  const r = s % 60;
  if (m === 0) return r + 's';
  return m + 'm ' + pad2(r) + 's';
}

function normalizeDigits(n) {
  return n.toLocaleString(undefined, { maximumFractionDigits: 0 });
}

let S = createInitialState();
let LANG = 'fr';
let CURRENT_VIEW = 'today';
let MODAL_STATE = null;

function createInitialState() {
  return {
    version: 2,
    lang: 'fr',
    theme: 'candy',
    profile: {
      name: 'Championne',
      avatar: '🦄',
      createdAt: new Date().toISOString(),
    },
    settings: {
      wakeTarget: '07:00',
      weekGoal: 7,
      monthGoal: 26,
      sound: true,
    },
    tasks: clone(DEFAULT_TASKS),
    rewards: clone(DEFAULT_REWARDS),
    days: {},
    timers: {},
    claimedWeeks: {},
    claimedMonths: {},
    achievements: {},
    purchases: [],
    spentPoints: 0,
    history: [],
    seenWelcome: false,
    themeIndex: 0,
  };
}

function clone(obj) {
  return JSON.parse(JSON.stringify(obj));
}

function migrateState(data) {
  const base = createInitialState();
  const out = Object.assign({}, base, data || {});
  out.profile = Object.assign({}, base.profile, (data && data.profile) || {});
  out.settings = Object.assign({}, base.settings, (data && data.settings) || {});
  out.days = (data && data.days) || {};
  out.timers = (data && data.timers) || {};
  out.claimedWeeks = (data && data.claimedWeeks) || {};
  out.claimedMonths = (data && data.claimedMonths) || {};
  out.achievements = (data && data.achievements) || {};
  out.purchases = (data && data.purchases) || [];
  out.history = (data && data.history) || [];
  out.spentPoints = (data && data.spentPoints) || 0;
  if (!Array.isArray(out.tasks) || !out.tasks.length) out.tasks = clone(DEFAULT_TASKS);
  if (!Array.isArray(out.rewards) || !out.rewards.length) out.rewards = clone(DEFAULT_REWARDS);
  // Clean stale timers
  const now = Date.now();
  Object.keys(out.timers).forEach(id => {
    if (now - out.timers[id] > 3 * 60 * 60 * 1000) delete out.timers[id];
  });
  return out;
}

function saveState() {
  try {
    localStorage.setItem(APP.storageKey, JSON.stringify(S));
  } catch (e) {
    console.warn('Save failed:', e);
  }
}

function loadState() {
  try {
    const raw = localStorage.getItem(APP.storageKey);
    if (!raw) return false;
    const parsed = JSON.parse(raw);
    S = migrateState(parsed);
    LANG = S.lang || 'fr';
    return true;
  } catch (e) {
    console.warn('Load failed:', e);
    return false;
  }
}

function pushHistory(entry) {
  S.history.unshift(Object.assign({ at: new Date().toISOString() }, entry));
  if (S.history.length > APP.maxHistory) S.history.length = APP.maxHistory;
}

/* ============================================================================

function t(key, vars) {
  const dict = I18N[LANG] || I18N.fr;
  let s = dict[key] != null ? dict[key] : (I18N.fr[key] != null ? I18N.fr[key] : key);
  if (vars) {
    Object.keys(vars).forEach(k => {
      s = s.replace(new RegExp('\\{' + k + '\\}', 'g'), vars[k]);
    });
  }
  return s;
}

function L(obj) {
  if (obj == null) return '';
  if (typeof obj === 'string') return obj;
  return obj[LANG] || obj.fr || obj.en || '';
}

function localeCode() {
  return LANG === 'fr' ? 'fr-FR' : 'en-US';
}

function fmtLongDate(d) {
  return d.toLocaleDateString(localeCode(), {
    weekday: 'long', day: 'numeric', month: 'long',
  });
}

function fmtShortDate(d) {
  return d.toLocaleDateString(localeCode(), {
    day: 'numeric', month: 'short',
  });
}

function weekdayShort(d) {
  const names = ['sunday', 'monday', 'tuesday', 'wednesday', 'thursday', 'friday', 'saturday'];
  return t(names[d.getDay()]);
}

/* ============================================================================
   SECTION F: DERIVED STATE HELPERS
   ============================================================================ */

function activeTasks() {
  return S.tasks.filter(x => x.active !== false);
}

function getDayData(key, create) {
  if (!S.days[key]) {
    if (!create) return { done: {} };
    S.days[key] = { done: {} };
  }
  return S.days[key];
}

function dayDoneCount(key) {
  const d = S.days[key];
  if (!d) return 0;
  const ids = activeTasks().map(x => x.id);
  return ids.filter(id => d.done[id]).length;
}

function dayEarned(key) {
  const d = S.days[key];
  if (!d) return 0;
  return Object.keys(d.done).reduce(
    (sum, id) => sum + (d.done[id].points || 0) + (d.done[id].bonus || 0),
    0
  );
}

function isPerfectDay(key) {
  const tasks = activeTasks();
  if (!tasks.length) return false;
  const d = S.days[key];
  if (!d) return false;
  return tasks.every(x => !!d.done[x.id]);
}

function totalEarnedPoints() {
  return Object.keys(S.days).reduce((sum, k) => sum + dayEarned(k), 0);
}

function availablePoints() {
  return Math.max(0, totalEarnedPoints() - S.spentPoints);
}

function levelInfo(points) {
  // XP for level L = 25 * (L-1)^2
  let level = 1;
  while (25 * level * level <= points) level++;
  const base = 25 * (level - 1) * (level - 1);
  const next = 25 * level * level;
  const span = Math.max(1, next - base);
  const into = points - base;
  return {
    level,
    into,
    span,
    next,
    pct: clamp(into / span, 0, 1),
  };
}

function currentStreak() {
  let n = 0;
  let d = startOfDay(new Date());
  // Allow "today" to be counted even if not yet perfect, but only if yesterday was
  if (!isPerfectDay(isoOf(d))) d = addDays(d, -1);
  let guard = 0;
  while (isPerfectDay(isoOf(d)) && guard < 5000) {
    n++;
    d = addDays(d, -1);
    guard++;
  }
  return n;
}

function bestStreak() {
  const keys = Object.keys(S.days).filter(isPerfectDay).sort();
  let best = 0;
  let run = 0;
  let prev = null;
  keys.forEach(k => {
    const d = dateFromKey(k);
    if (prev && (d - prev) === 86400000) run++;
    else run = 1;
    prev = d;
    if (run > best) best = run;
  });
  return best;
}

function weekPerfectCount(mondayKey) {
  const monday = dateFromKey(mondayKey);
  let n = 0;
  for (let i = 0; i < 7; i++) {
    if (isPerfectDay(isoOf(addDays(monday, i)))) n++;
  }
  return n;
}

function monthPerfectCount(year, month) {
  const last = new Date(year, month + 1, 0).getDate();
  let n = 0;
  for (let i = 1; i <= last; i++) {
    if (isPerfectDay(isoOf(new Date(year, month, i)))) n++;
  }
  return n;
}

function countPerfectWeeks() {
  const weeks = {};
  Object.keys(S.days).forEach(k => {
    if (!isPerfectDay(k)) return;
    weeks[weekKeyOf(dateFromKey(k))] = true;
  });
  let n = 0;
  Object.keys(weeks).forEach(wk => {
    if (weekPerfectCount(wk) >= 7) n++;
  });
  return n;
}

function countPerfectMonths() {
  const months = {};
  Object.keys(S.days).forEach(k => {
    if (isPerfectDay(k)) months[monthKeyOf(dateFromKey(k))] = true;
  });
  let n = 0;
  Object.keys(months).forEach(mk => {
    const parts = mk.split('-').map(Number);
    if (monthPerfectCount(parts[0], parts[1] - 1) >= S.settings.monthGoal) n++;
  });
  return n;
}

function countEarlyWakes() {
  const target = S.settings.wakeTarget || '07:00';
  let n = 0;
  Object.keys(S.days).forEach(k => {
    const entry = S.days[k].done && S.days[k].done.wake;
    if (!entry || !entry.at) return;
    const d = new Date(entry.at);
    const hhmm = pad2(d.getHours()) + ':' + pad2(d.getMinutes());
    if (hhmm <= target) n++;
  });
  return n;
}

function countTimerBonuses() {
  let n = 0;
  Object.keys(S.days).forEach(k => {
    const done = S.days[k].done || {};
    Object.keys(done).forEach(id => {
      if ((done[id].bonus || 0) > 0) n++;
    });
  });
  return n;
}

function countTasksDone() {
  let n = 0;
  Object.keys(S.days).forEach(k => {
    n += Object.keys(S.days[k].done || {}).length;
  });
  return n;
}

function buildStats() {
  const earned = totalEarnedPoints();
  return {
    perfectDays: Object.keys(S.days).filter(isPerfectDay).length,
    tasksDone: countTasksDone(),
    bestStreak: bestStreak(),
    currentStreak: currentStreak(),
    totalEarned: earned,
    level: levelInfo(earned).level,
    earlyWakes: countEarlyWakes(),
    timerBonuses: countTimerBonuses(),
    perfectWeeks: countPerfectWeeks(),
    perfectMonths: countPerfectMonths(),
    purchases: S.purchases.length,
    spentPoints: S.spentPoints,
  };
}

/* ============================================================================
   SECTION G: SOUND ENGINE
   ============================================================================ */

let audioCtx = null;

function ensureAudio() {
  if (!S.settings.sound) return null;
  try {
    if (!audioCtx) {
      const Ctx = window.AudioContext || window.webkitAudioContext;
      if (!Ctx) return null;
      audioCtx = new Ctx();
    }
    if (audioCtx.state === 'suspended') audioCtx.resume();
    return audioCtx;
  } catch (e) {
    return null;
  }
}

function tone(freq, duration, type, gain) {
  const ctx = ensureAudio();
  if (!ctx) return;
  try {
    const osc = ctx.createOscillator();
    const g = ctx.createGain();
    osc.type = type || 'sine';
    osc.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(gain || 0.15, ctx.currentTime + 0.015);
    g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + duration);
    osc.connect(g);
    g.connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + duration + 0.03);
  } catch (e) {
    /* ignore */
  }
}

/* ============================================================================
   SECTION H: CONFETTI
   ============================================================================ */

const Confetti = (function () {
  const canvas = $('#confetti-canvas');
  const ctx = canvas.getContext('2d');
  const particles = [];
  let running = false;
  let dpr = 1;

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.floor(window.innerWidth * dpr);
    canvas.height = Math.floor(window.innerHeight * dpr);
    canvas.style.width = window.innerWidth + 'px';
    canvas.style.height = window.innerHeight + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  resize();
  window.addEventListener('resize', resize);

  const COLORS = [
    '#ff7eb3', '#b48eff', '#ffc93c', '#4ade80',
    '#5eb8ff', '#ff8a65', '#ffffff', '#ff6b81',
  ];

  function spawn(n, opts) {
    opts = opts || {};
    const ox = opts.x != null ? opts.x : window.innerWidth / 2;
    const oy = opts.y != null ? opts.y : window.innerHeight * 0.32;
    const spread = opts.spread || 1;
    for (let i = 0; i < n; i++) {
      const angle = Math.random() * Math.PI * 2;
      const speed = (2 + Math.random() * 9) * spread;
      particles.push({
        x: ox,
        y: oy,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed - 5,
        size: 5 + Math.random() * 8,
        color: COLORS[Math.floor(Math.random() * COLORS.length)],
        rot: Math.random() * Math.PI * 2,
        vr: (Math.random() - 0.5) * 0.3,
        life: 1,
        decay: 0.007 + Math.random() * 0.008,
        shape: Math.random() < 0.35 ? 'circle' : 'rect',
      });
    }
    if (!running) {
      running = true;
      requestAnimationFrame(loop);
    }
  }

  function loop() {
    ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.vy += 0.25;
      p.vx *= 0.992;
      p.x += p.vx;
      p.y += p.vy;
      p.rot += p.vr;
      p.life -= p.decay;
      if (p.life <= 0 || p.y > window.innerHeight + 60) {
        particles.splice(i, 1);
        continue;
      }
      ctx.save();
      ctx.globalAlpha = Math.max(0, p.life);
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.fillStyle = p.color;
      if (p.shape === 'circle') {
        ctx.beginPath();
        ctx.arc(0, 0, p.size / 2, 0, Math.PI * 2);
        ctx.fill();
      } else {
        ctx.fillRect(-p.size / 2, -p.size / 3, p.size, p.size * 0.66);
      }
      ctx.restore();
    }
    if (particles.length) {
      requestAnimationFrame(loop);
    } else {
      running = false;
      ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
    }
  }

  return {
    burst(n, opts) { spawn(n || 80, opts || {}); },
    big() {
      spawn(140, { spread: 1.3 });
      setTimeout(() => spawn(90, { x: window.innerWidth * 0.15, y: window.innerHeight * 0.25 }), 180);
      setTimeout(() => spawn(90, { x: window.innerWidth * 0.85, y: window.innerHeight * 0.25 }), 340);
      setTimeout(() => spawn(60, { y: window.innerHeight * 0.5, spread: 1.1 }), 520);
    },
    star(x, y) {
      spawn(30, { x, y, spread: 0.7 });
    },
  };
})();

function toast(message, icon, ms) {

  el.innerHTML =

function openModal(html, opts) {
  opts = opts || {};
  const overlay = $('#modal-overlay');
  const box = $('#modal-box');
  box.innerHTML = html;
  overlay.classList.add('show');
  MODAL_STATE = { opts };

  // Wire close button if present
  const closeBtn = box.querySelector('[data-modal-close]');
  if (closeBtn) {
    closeBtn.addEventListener('click', closeModal);
  }

  // Auto-focus first input
  const firstInput = box.querySelector('input, select, textarea');
  if (firstInput && opts.autofocus !== false) {
    setTimeout(() => firstInput.focus(), 320);
  }

  if (opts.onOpen) opts.onOpen(box);
}

function closeModal() {
  const overlay = $('#modal-overlay');
  const box = $('#modal-box');
  overlay.classList.remove('show');
  MODAL_STATE = null;
  setTimeout(() => {
    box.innerHTML = '';
  }, 320);
}

// Click outside to close
$('#modal-overlay').addEventListener('click', e => {
  if (e.target.id === 'modal-overlay') closeModal();
});

// Escape key to close
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && MODAL_STATE) closeModal();
});

   ============================================================================ */

function toggleTask(taskId, dayKey) {
  const task = S.tasks.find(x => x.id === taskId);
  if (!task) return;
  const key = dayKey || todayKey();
  const day = getDayData(key, true);
  const wasPerfect = isPerfectDay(key);

  if (day.done[taskId]) {
    delete day.done[taskId];
    SFX.uncheck();
    toast(t('taskUndone'), '↩️', 1200);
    pushHistory({ type: 'uncheck', text: L(task.label), icon: task.icon });
  } else {
    day.done[taskId] = {
      at: new Date().toISOString(),
      points: task.points || 0,
      bonus: 0,
      sec: null,
    };
    SFX.check();
    toast(t('earnedPoints', { n: task.points || 0 }), '✨', 1300);
    pushHistory({ type: 'check', text: L(task.label), icon: task.icon, delta: task.points || 0 });
  }

  const nowPerfect = isPerfectDay(key);
  if (!wasPerfect && nowPerfect) {
    onPerfectDay(key);
  } else if (wasPerfect && !nowPerfect) {
    toast(t('taskUndone'), '💫', 1300);
  }

  saveState();
  checkAchievements();
  render();
}

function onPerfectDay(key) {
  SFX.star();
  toast(t('perfectDay'), '⭐', 2400);
  setTimeout(() => Confetti.burst(80, { y: window.innerHeight * 0.25 }), 60);

  const wk = weekKeyOf(dateFromKey(key));
  const count = weekPerfectCount(wk);
  if (count >= 7 && !S.claimedWeeks[wk]) {
    setTimeout(() => {
      SFX.reward();
      Confetti.big();
      toast(t('boxUnlocked'), '🎁', 3000);
    }, 700);
  }

  const d = dateFromKey(key);
  const mk = monthKeyOf(d);
  if (monthPerfectCount(d.getFullYear(), d.getMonth()) >= S.settings.monthGoal && !S.claimedMonths[mk]) {
    setTimeout(() => {
      SFX.reward();
      Confetti.big();
      toast(t('monthUnlocked'), '🏆', 3200);
    }, 1200);
  }
}

function startTimer(taskId) {
  S.timers[taskId] = Date.now();
  SFX.start();
  saveState();
  render();
}

function stopTimer(taskId) {
  const started = S.timers[taskId];
  if (!started) return;
  const elapsed = (Date.now() - started) / 1000;
  delete S.timers[taskId];

  const task = S.tasks.find(x => x.id === taskId);
  if (!task) {
    saveState();
    render();
    return;
  }

  const key = todayKey();
  const day = getDayData(key, true);
  const wasPerfect = isPerfectDay(key);

  const target = task.target || 900;
  const bonus = elapsed <= target ? 1 : 0;

  day.done[taskId] = {
    at: new Date().toISOString(),
    points: task.points || 0,
    bonus,
    sec: Math.round(elapsed),
  };

  if (bonus) {
    SFX.check();
    setTimeout(() => SFX.star(), 160);
    toast(t('speedBonusToast'), '⚡', 1900);
    Confetti.star(window.innerWidth / 2, window.innerHeight * 0.4);
  } else {
    SFX.check();
    toast(t('earnedPoints', { n: task.points || 0 }), '✨', 1400);
  }

  pushHistory({
    type: 'timer',
    text: L(task.label),
    icon: task.icon,
    delta: (task.points || 0) + bonus,
    sec: Math.round(elapsed),
  });

  if (!wasPerfect && isPerfectDay(key)) onPerfectDay(key);

  saveState();
  checkAchievements();
  render();
}

function buyReward(id) {
  const item = S.rewards.find(x => x.id === id);
  if (!item) return;
  if (availablePoints() < item.cost) {
    SFX.error();
    toast(t('notEnough'), '😅', 1800);
    return;
  }
  S.spentPoints += item.cost;
  S.purchases.push({
    id: item.id,
    label: L(item.label),
    icon: item.icon,
    cost: item.cost,
    at: new Date().toISOString(),
  });
  pushHistory({ type: 'purchase', text: L(item.label), icon: item.icon, delta: -item.cost });
  SFX.reward();
  Confetti.burst(60, { y: window.innerHeight * 0.4 });
  toast(t('purchased', { n: L(item.label), c: item.cost }), item.icon, 2400);
  saveState();
  checkAchievements();
  render();
}

function claimWeek(wk) {
  if (weekPerfectCount(wk) < 7 || S.claimedWeeks[wk]) return;
  S.claimedWeeks[wk] = new Date().toISOString();
  SFX.reward();
  Confetti.big();
  saveState();
  openModal(
    '<div class="modal-icon">🎁</div>' +
    '<div class="modal-title">' + escapeHtml(t('boxUnlocked')) + '</div>' +
    '<div class="modal-text">' +
      escapeHtml(LANG === 'fr'
        ? 'Tu as eu 7 jours parfaits cette semaine ! Demande à un parent de te donner ta surprise 😄'
        : 'You got 7 perfect days this week! Ask a grown-up for your surprise 😄') +
    '</div>' +
    '<div class="modal-actions">' +
      '<button class="btn primary" data-modal-close>' + escapeHtml(t('close')) + '</button>' +
    '</div>'
  );
  render();
}

function claimMonth(mk) {
  const parts = mk.split('-').map(Number);
  const count = monthPerfectCount(parts[0], parts[1] - 1);
  if (count < S.settings.monthGoal || S.claimedMonths[mk]) return;
  S.claimedMonths[mk] = new Date().toISOString();
  SFX.reward();
  Confetti.big();
  saveState();
  openModal(
    '<div class="modal-icon">🏆</div>' +
    '<div class="modal-title">' + escapeHtml(t('monthUnlocked')) + '</div>' +
    '<div class="modal-text">' +
      escapeHtml(LANG === 'fr'
        ? 'Objectif du mois atteint ! Tu as gagné le gros cadeau du mois. Bravo championne ! 🎉'
        : 'Monthly goal reached! You earned the big monthly prize. Well done champion! 🎉') +
    '</div>' +
    '<div class="modal-actions">' +
      '<button class="btn gold" data-modal-close>' + escapeHtml(t('close')) + '</button>' +
    '</div>'
  );
  render();
}

function checkAchievements() {
  const ctx = buildStats();
  const newly = [];
  ACHIEVEMENTS.forEach(a => {
    if (S.achievements[a.id]) return;
    let ok = false;
    try { ok = !!a.check(ctx); } catch (e) { ok = false; }
    if (ok) {
      S.achievements[a.id] = new Date().toISOString();
      newly.push(a);
    }
  });
  if (newly.length) {
    saveState();
    newly.forEach((a, i) => {
      setTimeout(() => {
        SFX.star();
        toast(t('newAchievement') + ' ' + L(a.name), a.icon, 2800);
        Confetti.burst(45, { y: window.innerHeight * 0.22 });
      }, i * 750);
    });
  }

  // Level up detection
  const lv = levelInfo(totalEarnedPoints()).level;
  if (S._lastLevel == null) {
    S._lastLevel = lv;
  } else if (lv > S._lastLevel) {
    S._lastLevel = lv;
    setTimeout(() => {
      SFX.levelUp();
      Confetti.big();
      toast(t('levelUp', { n: lv }), '🎉', 3000);
    }, 500);
  } else {
    S._lastLevel = lv;
  }
}

function ringSvg(pct) {
  const R = 52;
  const C = 2 * Math.PI * R;
  const off = C * (1 - clamp(pct, 0, 1));
  return (
    '<svg viewBox="0 0 120 120" aria-hidden="true">' +
      '<circle class="ring-bg" cx="60" cy="60" r="' + R + '"/>' +
      '<circle class="ring-fg" cx="60" cy="60" r="' + R + '" ' +
        'stroke-dasharray="' + C.toFixed(2) + '" ' +
        'stroke-dashoffset="' + off.toFixed(2) + '"/>' +
    '</svg>'
  );
}

function renderTaskRow(task, key) {
  const day = S.days[key] || { done: {} };
  const entry = day.done[task.id];
  const isDone = !!entry;
  const running = !!S.timers[task.id];
  const isTimer = task.type === 'timer';

  let cls = 'task';
  if (isDone) cls += ' done';
  if (running) cls += ' timer-running';

  let meta = '<span class="badge points">+' + task.points + ' ' + escapeHtml(t('point')) + '</span>';

  if (isTimer) {
    const targetMin = Math.round((task.target || 900) / 60);
    meta += '<span class="badge">⏱ ' + escapeHtml(t('target', { t: targetMin + ' min' })) + '</span>';
  }
  if (task.id === 'wake' && S.settings.wakeTarget) {
    meta += '<span class="badge">🌅 ' + escapeHtml(S.settings.wakeTarget) + '</span>';
  }
  if (isDone && entry.sec) {
    meta += '<span class="badge success">' + escapeHtml(t('took', { t: fmtDurationLong(entry.sec) })) + '</span>';
  }
  if (isDone && entry.bonus) {
    meta += '<span class="badge bonus">⚡ +' + entry.bonus + '</span>';
  }

  let right;
  if (running) {
    right = '<span class="task-timer" data-timer="' + escapeHtml(task.id) + '">0:00</span>';
  } else {
    right = '<span class="task-check">✓</span>';
  }

  return (
    '<button class="' + cls + '" data-action="task" data-task="' + escapeHtml(task.id) + '" data-day="' + escapeHtml(key) + '">' +
      '<span class="task-icon">' + escapeHtml(task.icon) + '</span>' +
      '<span class="task-body">' +
        '<span class="task-label">' + escapeHtml(L(task.label)) + '</span>' +
        '<span class="task-meta">' + meta + '</span>' +
      '</span>' +
      '<span class="task-right">' + right + '</span>' +
    '</button>'
  );
}

function statCard(icon, value, label) {

function renderHeatmap() {
  const today = startOfDay(new Date());
  const cells = [];
  // Start from 8 weeks ago Monday
  const start = addDays(weekStartOf(today), -7 * 7);
  for (let i = 0; i < 56; i++) {
    const date = addDays(start, i);
    const key = isoOf(date);
    const done = dayDoneCount(key);
    const total = activeTasks().length || 1;
    const ratio = total ? done / total : 0;
    const future = date > today;
    let cls = 'heatmap-cell';
    if (future) cls += ' future';
    else if (ratio >= 1) cls += ' level-4';
    else if (ratio >= 0.75) cls += ' level-3';
    else if (ratio >= 0.5) cls += ' level-2';
    else if (ratio > 0) cls += ' level-1';
    cells.push('<div class="' + cls + '" title="' + escapeHtml(fmtShortDate(date)) + '"></div>');
  }
  return '<div class="heatmap">' + cells.join('') + '</div>';
}

function renderActivityCard() {
  if (!S.history.length) {
    return (
      '<div class="card">' +
        '<div class="card-title"><span class="emoji">📜</span><span>' + escapeHtml(t('recentActivity')) + '</span></div>' +
        '<div class="empty-state">' +
          '<div class="icon">📭</div>' +
          '<div class="text">' + escapeHtml(t('noActivity')) + '</div>' +
        '</div>' +
      '</div>'
    );
  }
  const items = S.history.slice(0, 12).map(h => {
    const d = new Date(h.at);
    const time = pad2(d.getHours()) + ':' + pad2(d.getMinutes());
    const deltaStr = h.delta != null
      ? (h.delta > 0 ? '+' + h.delta : '' + h.delta) + ' pts'
      : '';
    return (
      '<div class="row" style="padding:9px 0;border-bottom:1px solid var(--border)">' +
        '<span style="font-size:20px">' + escapeHtml(h.icon || '•') + '</span>' +
        '<span class="grow small bold">' + escapeHtml(h.text) + '</span>' +
        (deltaStr ? '<span class="badge ' + (h.delta > 0 ? 'success' : 'danger') + '">' + escapeHtml(deltaStr) + '</span>' : '') +
        '<span class="tiny muted tabular">' + escapeHtml(time) + '</span>' +
      '</div>'
    );
  }).join('');
  return (
    '<div class="card">' +
      '<div class="card-title"><span class="emoji">📜</span><span>' + escapeHtml(t('recentActivity')) + '</span></div>' +
      '<div>' + items + '</div>' +
    '</div>'

/* ============================================================================
   SECTION M: RENDER ENGINE
   ============================================================================ */

function render() {
  document.documentElement.className = 'theme-' + S.theme;
  document.documentElement.lang = LANG;

  $('#brand-title').textContent = S.profile.name || t('appName');
  $('#brand-subtitle').textContent = t('tagline');

  const view = VIEWS[CURRENT_VIEW] || VIEWS.today;
  $('#main-view').innerHTML = view();

  renderTabbar();
  updateTimerDisplays();
}

function renderTabbar() {
  const tabs = [
    { id: 'today',    icon: '☀️', label: t('tabToday'),    badge: false },
    { id: 'week',     icon: '📅', label: t('tabWeek'),     badge: hasUnclaimedWeek() },
    { id: 'month',    icon: '🗓️', label: t('tabMonth'),    badge: hasUnclaimedMonth() },
    { id: 'stats',    icon: '📊', label: t('tabStats'),    badge: false },
    { id: 'rewards',  icon: '🏆', label: t('tabRewards'),  badge: false },
  ];

  $('#tabbar').innerHTML = tabs.map(tb =>
    '<button class="tab ' + (CURRENT_VIEW === tb.id ? 'active' : '') + '" data-action="switch-view" data-view="' + escapeHtml(tb.id) + '">' +
      (tb.badge ? '<span class="tab-dot"></span>' : '') +
      '<span class="tab-icon">' + tb.icon + '</span>' +
      '<span>' + escapeHtml(tb.label) + '</span>' +
    '</button>'
  ).join('');
}

function hasUnclaimedWeek() {
  const wk = weekKeyOf(new Date());
  return weekPerfectCount(wk) >= 7 && !S.claimedWeeks[wk];
}

function hasUnclaimedMonth() {
  const now = new Date();
  const mk = monthKeyOf(now);
  return monthPerfectCount(now.getFullYear(), now.getMonth()) >= S.settings.monthGoal
    && !S.claimedMonths[mk];
}

function updateTimerDisplays() {
  const ids = Object.keys(S.timers);
  if (!ids.length) return;
  ids.forEach(id => {
    const el = document.querySelector('[data-timer="' + id + '"]');
    if (!el) return;
    const elapsed = (Date.now() - S.timers[id]) / 1000;
    el.textContent = fmtDuration(elapsed);
    const task = S.tasks.find(x => x.id === id);
    const target = task && task.target ? task.target : 900;
    const row = el.closest('.task');
    if (row) {
      if (elapsed > target) row.classList.add('timer-over');
      else row.classList.remove('timer-over');
    }
  });
}

setInterval(updateTimerDisplays, 500);

/* ============================================================================
   SECTION N: EVENT HANDLING
   ============================================================================ */

document.addEventListener('click', function (e) {
  const el = e.target.closest('[data-action]');
  if (!el) return;
  const action = el.dataset.action;

  switch (action) {
    /* ------- Navigation ------- */
    case 'switch-view': {
      const v = el.dataset.view;
      if (VIEWS[v]) {
        CURRENT_VIEW = v;
        render();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
      break;
    }

    /* ------- Task toggle / timer ------- */
    case 'task': {
      const taskId = el.dataset.task;
      const dayKey = el.dataset.day || todayKey();
      const task = S.tasks.find(x => x.id === taskId);
      if (!task) break;

      if (task.type === 'timer') {
        if (S.timers[taskId]) {
          stopTimer(taskId);
        } else if (S.days[dayKey] && S.days[dayKey].done[taskId]) {
          toggleTask(taskId, dayKey);
        } else {
          startTimer(taskId);
        }
      } else {
        toggleTask(taskId, dayKey);
      }
      break;
    }

    /* ------- Day detail ------- */
    case 'open-day': {
      openDayDetail(el.dataset.day);
      break;
    }

    /* ------- Claims ------- */
    case 'claim-week':
      claimWeek(el.dataset.week);
      break;
    case 'claim-month':
      claimMonth(el.dataset.month);
      break;

    /* ------- Shop ------- */
    case 'buy':
      buyReward(el.dataset.reward);
      break;

    /* ------- Topbar ------- */
    case 'cycle-theme': {
      const idx = (THEMES.indexOf(S.theme) + 1) % THEMES.length;
      S.theme = THEMES[idx];
      saveState();
      render();
      break;
    }
    case 'toggle-lang': {
      LANG = LANG === 'fr' ? 'en' : 'fr';
      S.lang = LANG;
      saveState();
      render();
      break;
    }
    case 'set-theme':
      S.theme = el.dataset.theme;
      saveState();
      render();
      break;
    case 'set-lang':
      LANG = el.dataset.lang;
      S.lang = LANG;
      saveState();
      render();
      break;

    /* ------- Settings ------- */
    case 'set-avatar':
      S.profile.avatar = el.dataset.avatar;
      SFX.check();
      saveState();
      render();
      break;

    case 'toggle-sound':
      S.settings.sound = !S.settings.sound;
      saveState();
      if (S.settings.sound) SFX.check();
      render();
      break;

    case 'toggle-task-active': {
      const id = el.dataset.taskId;
      const task = S.tasks.find(x => x.id === id);
      if (task) {
        task.active = task.active === false ? true : false;
        saveState();
        render();
      }
      break;
    }

    case 'delete-task': {
      const id = el.dataset.taskId;
      const task = S.tasks.find(x => x.id === id);
      if (!task) break;
      openConfirmModal(
        LANG === 'fr' ? 'Supprimer cette tâche ?' : 'Delete this task?',
        LANG === 'fr' ? 'La tâche « ' + L(task.label) + ' » sera retirée.' : 'Task "' + L(task.label) + '" will be removed.',
        () => {
          S.tasks = S.tasks.filter(x => x.id !== id);
          saveState();
          render();
          closeModal();
        }
      );
      break;
    }

    case 'open-add-task':
      openAddTaskModal();
      break;

    case 'export-data':
      exportData();
      break;

    case 'import-data': {
      const input = $('#import-file');
      if (input) input.click();
      break;
    }

    case 'open-reset':
      openResetModal();
      break;

    case 'do-reset':
      localStorage.removeItem(APP.storageKey);
      S = createInitialState();
      LANG = S.lang;
      saveState();
      closeModal();
      render();
      toast('🧹 ' + t('resetAll'), '🧹', 1800);
      break;

    case 'save-task':
      handleSaveTask();
      break;

    case 'save-edit-task':
      handleSaveEditTask(el.dataset.taskId);
      break;

    /* ------- Welcome ------- */
    case 'welcome-close':
      S.seenWelcome = true;
      saveState();
      closeModal();
      break;
  }
});

/* Click handling for the topbar theme/lang buttons (which have IDs, not data-action) */
$('#btn-theme').addEventListener('click', () => {
  const idx = (THEMES.indexOf(S.theme) + 1) % THEMES.length;
  S.theme = THEMES[idx];
  SFX.click();
  saveState();
  render();
});

$('#btn-lang').addEventListener('click', () => {
  LANG = LANG === 'fr' ? 'en' : 'fr';
  S.lang = LANG;
  SFX.click();
  saveState();
  render();
});

/* ---------- Live input handling ---------- */
document.addEventListener('input', function (e) {
  const el = e.target.closest('[data-field]');
  if (!el) return;
  const f = el.dataset.field;

  if (f === 'name') {
    S.profile.name = el.value.slice(0, 20);
    $('#brand-title').textContent = S.profile.name || t('appName');
    saveState();
  } else if (f === 'wakeTarget') {
    S.settings.wakeTarget = el.value || '07:00';
    saveState();
  } else if (f === 'weekGoal') {
    S.settings.weekGoal = clamp(parseInt(el.value, 10) || 7, 1, 7);
    saveState();
  } else if (f === 'monthGoal') {
    S.settings.monthGoal = clamp(parseInt(el.value, 10) || 26, 1, 31);
    saveState();
  }
});

/* ---------- Import file ---------- */
document.addEventListener('change', function (e) {
  if (e.target.id !== 'import-file') return;
  const file = e.target.files && e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function (ev) {
    try {
      const data = JSON.parse(ev.target.result);
      S = migrateState(data);
      LANG = S.lang || 'fr';
      saveState();
      render();
      toast('📥 ' + t('importData') + ' ✓', '✅', 1800);
    } catch (err) {
      toast('❌ ' + (LANG === 'fr' ? 'Fichier invalide' : 'Invalid file'), '❌', 2000);
    }
  };
  reader.readAsText(file);
  e.target.value = '';
});

function openDayDetail(key) {
  const date = dateFromKey(key);
  const tasks = activeTasks();
  const done = dayDoneCount(key);
  const earned = dayEarned(key);
  const perfect = isPerfectDay(key);

  const rows = tasks.map(task => {
    const day = S.days[key] || { done: {} };
    const d = day.done[task.id];
    const isDone = !!d;
    const right = isDone
      ? '<span class="badge success">✓ +' + ((d.points || 0) + (d.bonus || 0)) + '</span>'
      : '<span class="badge">—</span>';
    return (
      '<div class="row" style="padding:9px 0;border-bottom:1px solid var(--border)">' +
        '<span style="font-size:20px">' + escapeHtml(task.icon) + '</span>' +
        '<span class="grow small bold"' + (isDone ? ' style="opacity:.55;text-decoration:line-through"' : '') + '>' +
          escapeHtml(L(task.label)) +
        '</span>' +
        right +
      '</div>'
    );
  }).join('');

  const html =
    '<button class="modal-close" data-modal-close aria-label="Close">✕</button>' +
    '<div class="modal-icon">' + (perfect ? '⭐' : '📅') + '</div>' +
    '<div class="modal-title" style="text-transform:capitalize">' + escapeHtml(fmtLongDate(date)) + '</div>' +
    '<div class="modal-text">' +
      done + ' / ' + tasks.length + ' ' + escapeHtml(t('tasksToday')) +
      ' · ⭐ ' + earned + ' ' + escapeHtml(t('points')) +
    '</div>' +
    '<hr class="divider">' +
    '<div>' + rows + '</div>' +
    '<div class="modal-actions">' +
      '<button class="btn ghost" data-modal-close>' + escapeHtml(t('close')) + '</button>' +
    '</div>';

  openModal(html);
}

    '<div class="modal-icon">⚠️</div>' +

    '<div class="modal-text">' + escapeHtml(text) + '</div>' +
    '<div class="modal-actions">' +
      '<button class="btn ghost" data-modal-close>' + escapeHtml(t('cancel')) + '</button>' +
      '<button class="btn danger" id="confirm-action-btn">' + escapeHtml(t('yes')) + '</button>' +

}
