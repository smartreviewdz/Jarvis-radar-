function handleSaveTask() {
  const nameInput = $('#new-task-name');
  const pointsInput = $('#new-task-points');
  const kindInput = $('#new-task-kind');
  const targetInput = $('#new-task-target');
  const iconInput = $('#new-task-icon');
  if (!nameInput) return;

  const name = nameInput.value.trim();
  if (!name) {
    toast('⚠️ ' + t('taskName'), '⚠️', 1500);
    return;
  }
  const pts = clamp(parseInt(pointsInput.value, 10) || 1, 1, 10);
  const kind = kindInput.value;
  const mins = clamp(parseInt(targetInput.value, 10) || 10, 1, 120);
  const icon = (iconInput.value || '✅').trim().slice(0, 3) || '✅';

  S.tasks.push({
    id: 't' + uid(),
    icon: icon,
    label: { fr: name, en: name },
    points: pts,
    type: kind,
    target: kind === 'timer' ? mins * 60 : null,
    active: true,
  });

  saveState();
  closeModal();
  render();
  toast(t('save') + ' ✓', '✅', 1400);
}

function openEditTaskModal(taskId) {
  const task = S.tasks.find(x => x.id === taskId);
  if (!task) return;
  const html =
    '<button class="modal-close" data-modal-close aria-label="Close">✕</button>' +
    '<div class="modal-icon">' + escapeHtml(task.icon) + '</div>' +
    '<div class="modal-title">' + escapeHtml(LANG === 'fr' ? 'Modifier' : 'Edit') + '</div>' +
    '<div class="field">' +
      '<label class="field-label">' + escapeHtml(t('taskName')) + '</label>' +
      '<input class="input" id="edit-task-name" maxlength="30" value="' + escapeHtml(L(task.label)) + '" />' +
    '</div>' +
    '<div class="field">' +
      '<label class="field-label">' + escapeHtml(t('taskIcon')) + '</label>' +
      '<input class="input" id="edit-task-icon" maxlength="3" value="' + escapeHtml(task.icon) + '" />' +
    '</div>' +
    '<div class="field">' +
      '<label class="field-label">' + escapeHtml(t('taskPoints')) + '</label>' +
      '<input class="input" id="edit-task-points" type="number" min="1" max="10" value="' + task.points + '" />' +
    '</div>' +
    '<div class="modal-actions">' +
      '<button class="btn ghost" data-modal-close>' + escapeHtml(t('cancel')) + '</button>' +
      '<button class="btn primary" data-action="save-edit-task" data-task-id="' + escapeHtml(taskId) + '">' + escapeHtml(t('save')) + '</button>' +
    '</div>';
  openModal(html);
}

function handleSaveEditTask(taskId) {
  const task = S.tasks.find(x => x.id === taskId);
  if (!task) return;
  const nameInput = $('#edit-task-name');
  const iconInput = $('#edit-task-icon');
  const pointsInput = $('#edit-task-points');
  if (!nameInput) return;
  const name = nameInput.value.trim();
  if (!name) {
    toast('⚠️ ' + t('taskName'), '⚠️', 1500);
    return;
  }
  task.label = { fr: name, en: name };
  task.icon = (iconInput.value || '✅').trim().slice(0, 3) || '✅';
  task.points = clamp(parseInt(pointsInput.value, 10) || 1, 1, 10);
  saveState();
  closeModal();
  render();
  toast(t('save') + ' ✓', '✅', 1400);
}

function showWelcomeModal() {
  const html =
    '<div class="modal-icon">' + escapeHtml(S.profile.avatar) + '</div>' +
    '<div class="modal-title">' + escapeHtml(t('welcomeTitle')) + '</div>' +
    '<div class="modal-text">' + escapeHtml(t('welcomeText')) + '</div>' +
    '<div class="modal-actions">' +
      '<button class="btn primary" data-action="welcome-close">🚀 ' + escapeHtml(t('letsGo')) + '</button>' +
    '</div>';
  openModal(html, { autofocus: false });
}

/* ============================================================================
   SECTION P: EXPORT DATA
   ============================================================================ */

function exportData() {
  try {
    const blob = new Blob([JSON.stringify(S, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'starquest-sauvegarde-' + todayKey() + '.json';
    document.body.appendChild(a);
    a.click();
    setTimeout(() => {
      URL.revokeObjectURL(url);
      a.remove();
    }, 400);
    toast('📤 ' + t('exportData'), '✅', 1800);
  } catch (e) {
    toast('❌ ' + (LANG === 'fr' ? 'Erreur' : 'Error'), '❌', 1800);
  }
}

/* ============================================================================
   SECTION Q: BOOT
   ============================================================================ */

function boot() {
  const had = loadState();
  if (!had) {
    S = createInitialState();
    LANG = 'fr';
    saveState();
  }
  S._lastLevel = levelInfo(totalEarnedPoints()).level;

  render();
  checkAchievements();

  if (!had) {
    setTimeout(showWelcomeModal, 400);
  }

  // Unlock audio on first interaction
  const unlock = () => {
    ensureAudio();
    document.removeEventListener('touchstart', unlock);
    document.removeEventListener('click', unlock);
  };
  document.addEventListener('touchstart', unlock, { passive: true });
  document.addEventListener('click', unlock);

  // Auto-refresh today view at midnight
  setInterval(() => {
    const key = todayKey();
    if (boot._lastDay && boot._lastDay !== key) {
      boot._lastDay = key;
      render();
    }
    boot._lastDay = key;
  }, 60000);
  boot._lastDay = todayKey();
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', boot);
} else {
  boot();
}

})();
</script>
</body>
</html>
