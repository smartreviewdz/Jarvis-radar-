      '<input class="input" id="new-task-icon" maxlength="3" value="✅" />' +
    '</div>' +
    '<div class="field">' +
      '<label class="field-label">' + escapeHtml(t('taskPoints')) + '</label>' +
      '<input class="input" id="new-task-points" type="number" min="1" max="10" value="1" />' +
    '</div>' +
    '<div class="field">' +
      '<label class="field-label">' + escapeHtml(t('taskKind')) + '</label>' +
      '<select class="select" id="new-task-kind">' +
        '<option value="check">' + escapeHtml(t('kindCheck')) + '</option>' +
        '<option value="timer">' + escapeHtml(t('kindTimer')) + '</option>' +
      '</select>' +
    '</div>' +
    '<div class="field">' +
      '<label class="field-label">' + escapeHtml(t('targetMinutes')) + '</label>' +
      '<input class="input" id="new-task-target" type="number" min="1" max="120" value="10" />' +
    '</div>' +
    '<div class="field">' +
      '<label class="field-label">' + escapeHtml(t('taskDifficulty')) + '</label>' +
      '<select class="select" id="new-task-difficulty">' +
        '<option value="easy">' + escapeHtml(t('difficultyEasy')) + '</option>' +
        '<option value="medium" selected>' + escapeHtml(t('difficultyMedium')) + '</option>' +
        '<option value="hard">' + escapeHtml(t('difficultyHard')) + '</option>' +
      '</select>' +
    '</div>' +
    '<div class="modal-actions">' +
      '<button class="btn ghost" data-modal-close>' + escapeHtml(t('cancel')) + '</button>' +
      '<button class="btn primary" data-action="save-task">' + escapeHtml(t('save')) + '</button>' +
    '</div>';
  openModal(html);
}

function handleSaveTask() {
  const nameInput = $('#new-task-name');
  const pointsInput = $('#new-task-points');
  const kindInput = $('#new-task-kind');
  const targetInput = $('#new-task-target');
  const iconInput = $('#new-task-icon');
  const diffInput = $('#new-task-difficulty');
  if (!nameInput) return;

  const name = nameInput.value.trim();
  if (!name) {
    toast('⚠️ ' + t('taskName'), '⚠️', 1500);
    return;
  }
  const pts = clamp(parseInt(pointsInput.value, 10) || 1, 1, 10);
  const kind = kindInput.value;
  const mins = clamp(parseInt(targetInput.value, 10) || 10, 1, 120);
  const icon = (iconInput.value || '✅').trim().slice(0, 3) || '✅';
  const difficulty = diffInput ? diffInput.value : 'medium';

  S.tasks.push({
    id: 't' + uid(),
    icon: icon,
    label: { fr: name, en: name },
    points: pts,
    type: kind,
    target: kind === 'timer' ? mins * 60 : null,
    active: true,
    difficulty: difficulty,
  });

  saveState();
  closeModal();
  render();
  toast(t('save') + ' ✓', '✅', 1400, 'success');
}

function openEditTaskModal(taskId) {
  const task = S.tasks.find(x => x.id === taskId);
  if (!task) return;
  const html =
    '<button class="modal-close" data-modal-close aria-label="Close">✕</button>' +
    '<div class="modal-icon">' + escapeHtml(task.icon) + '</div>' +
    '<div class="modal-title">' + escapeHtml(t('editTask')) + '</div>' +
    '<div class="field">' +
      '<label class="field-label">' + escapeHtml(t('taskName')) + '</label>' +
      '<input class="input" id="edit-task-name" maxlength="30" value="' + escapeHtml(L(task.label)) + '" />' +
    '</div>' +
    '<div class="field">' +
      '<label class="field-label">' + escapeHtml(t('taskIcon')) + '</label>' +
      '<input class="input" id="edit-task-icon" maxlength="3" value="' + escapeHtml(task.icon) + '" />' +
    '</div>' +
    '<div class="field">' +
      '<label class="field-label">' + escapeHtml(t('taskPoints')) + '</label>' +
      '<input class="input" id="edit-task-points" type="number" min="1" max="10" value="' + task.points + '" />' +
    '</div>' +
    '<div class="modal-actions">' +
      '<button class="btn ghost" data-modal-close>' + escapeHtml(t('cancel')) + '</button>' +
      '<button class="btn primary" data-action="save-edit-task" data-task-id="' + escapeHtml(taskId) + '">' + escapeHtml(t('save')) + '</button>' +
    '</div>';
  openModal(html);
}

function handleSaveEditTask(taskId) {
  const task = S.tasks.find(x => x.id === taskId);
  if (!task) return;
  const nameInput = $('#edit-task-name');
  const iconInput = $('#edit-task-icon');
  const pointsInput = $('#edit-task-points');
  if (!nameInput) return;
  const name = nameInput.value.trim();
  if (!name) {
    toast('⚠️ ' + t('taskName'), '⚠️', 1500);
    return;
  }
  task.label = { fr: name, en: name };
  task.icon = (iconInput.value || '✅').trim().slice(0, 3) || '✅';
  task.points = clamp(parseInt(pointsInput.value, 10) || 1, 1, 10);
  saveState();
  closeModal();
  render();
  toast(t('save') + ' ✓', '✅', 1400, 'success');
}

function showWelcomeModal() {
  const html =
    '<div class="modal-icon">' + escapeHtml(S.profile.avatar) + '</div>' +
    '<div class="modal-title">' + escapeHtml(t('welcomeTitle')) + '</div>' +
    '<div class="modal-text">' + escapeHtml(t('welcomeText')) + '</div>' +
    '<div class="modal-actions">' +
      '<button class="btn primary" data-action="welcome-close">🚀 ' + escapeHtml(t('letsGo')) + '</button>' +
    '</div>';
  openModal(html, { autofocus: false });
}

/* ============================================================================
 * SECTION 32: EXPORT DATA
   ============================================================================ */

function exportData() {
  try {
    const blob = new Blob([JSON.stringify(S, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'starquest-' + todayKey() + '.json';
    document.body.appendChild(a);
    a.click();
    setTimeout(() => {
      URL.revokeObjectURL(url);
      a.remove();
    }, 400);
    toast('📤 ' + t('exportData'), '✅', 1800, 'success');
  } catch (e) {
    toast('❌ ' + (LANG === 'fr' ? 'Erreur' : 'Error'), '❌', 1800, 'danger');
  }
}

/* ============================================================================
 * SECTION 33: BOOT
   ============================================================================ */

function boot() {
  const had = loadState();
  if (!had) {
    S = createInitialState();
    saveState();
  }
  LANG = GLOBAL_SETTINGS.lang || 'fr';

  S._lastLevel = S.level || 1;

  render();
  refreshQuests();
  updateQuests();
  checkAchievements();

  if (!had) {
    setTimeout(showWelcomeModal, 500);
  }

  // Unlock audio on first interaction
  const unlock = () => {
    ensureAudio();
    document.removeEventListener('touchstart', unlock);
    document.removeEventListener('click', unlock);
  };
  document.addEventListener('touchstart', unlock, { passive: true });
  document.addEventListener('click', unlock);

  // Wire topbar buttons
  const btnShopQuick = $('#btn-shop-quick');
  if (btnShopQuick) {
    btnShopQuick.addEventListener('click', () => {
      CURRENT_VIEW = 'shop';
      CURRENT_TAB = 'all';
      render();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });
  }
  const btnNotifications = $('#btn-notifications');
  if (btnNotifications) {
    btnNotifications.addEventListener('click', () => {
      showNotificationsModal();
    });
  }
  const btnTheme = $('#btn-theme');
  if (btnTheme) {
    btnTheme.addEventListener('click', () => {
      const idx = (THEMES.indexOf(GLOBAL_SETTINGS.theme) + 1) % THEMES.length;
      GLOBAL_SETTINGS.theme = THEMES[idx];
      SFX.click();
      saveState();
      render();
    });
  }
  const btnLang = $('#btn-lang');
  if (btnLang) {
    btnLang.addEventListener('click', () => {
      LANG = LANG === 'fr' ? 'en' : 'fr';
      GLOBAL_SETTINGS.lang = LANG;
      SFX.click();
      saveState();
      render();
    });
  }

  // Autosave every X ms
  setInterval(() => {
    saveState();
  }, APP.autosaveMs);

  // Update timers and refresh daily at midnight
  setInterval(() => {
    const key = todayKey();
    if (boot._lastDay && boot._lastDay !== key) {
      boot._lastDay = key;
      refreshQuests();
      render();
    }
    boot._lastDay = key;
    updateQuests();
  }, 60000);
  boot._lastDay = todayKey();
}

function showNotificationsModal() {
  const stats = buildStats();
  const items = [];
  if (canClaimDaily()) items.push({ icon: '📅', title: t('dailyLogin'), text: t('notifDailyLogin') });
  if (canSpin()) items.push({ icon: '🎡', title: t('spinWheel'), text: t('notifDailySpin') });
  const completedQuests = [...S.quests.daily, ...S.quests.weekly, ...S.quests.monthly].filter(q => q.completed && !q.claimed);
  if (completedQuests.length) items.push({ icon: '📜', title: t('questComplete'), text: completedQuests.length + ' quest(s)' });
  const wk = weekKeyOf(new Date());
  if (weekPerfectCount(wk) >= 7 && !S.claimedWeeks[wk]) items.push({ icon: '🎁', title: t('theBox'), text: t('notifPerfectWeek') });

  const itemsHTML = items.length
    ? items.map(n => '<div class="row gap-sm" style="padding:10px 0;border-bottom:1px solid var(--border)"><span style="font-size:22px">' + n.icon + '</span><div class="grow"><div class="bold small">' + escapeHtml(n.title) + '</div><div class="tiny muted">' + escapeHtml(n.text) + '</div></div></div>').join('')
    : '<div class="empty-state"><div class="icon">✨</div><div class="text">' + (LANG === 'fr' ? 'Aucune notification' : 'No notifications') + '</div></div>';

  openModal(
    '<button class="modal-close" data-modal-close aria-label="Close">✕</button>' +
    '<div class="modal-icon">🔔</div>' +
    '<div class="modal-title">' + escapeHtml(LANG === 'fr' ? 'Notifications' : 'Notifications') + '</div>' +
    '<div style="text-align:left;margin-top:12px">' + itemsHTML + '</div>' +
    '<div class="modal-actions"><button class="btn ghost" data-modal-close>' + escapeHtml(t('close')) + '</button></div>',
    { autofocus: false }
  );
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', boot);
} else {
  boot();
}

})();
</script>
